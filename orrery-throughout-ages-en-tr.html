<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Skies: From Epicycles to Heliocentrism</title>
<style>
  :root{
    --navy-deep:#0B1220;
    --navy-panel:#1C2740;
    --navy-panel-light:#243254;
    --parchment:#E8DFC8;
    --parchment-dim:#cfc4a4;
    --brass:#C9A24B;
    --brass-bright:#E0BE6C;
    --steel:#6E8FAE;
    --rust:#A6441F;
    --line:#3A4A6B;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--navy-deep); color:var(--parchment);
    font-family:var(--sans);
  }
  body{
    display:flex; flex-direction:column;
    min-height:100vh;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* Day view: invert luminance and rotate hue back, a standard technique
     that guarantees the same contrast ratios as the night view, just with
     the polarity flipped -- important for a weak projector, where a
     hand-tuned second palette could easily end up low-contrast. Applied to
     <html> rather than <body> so the root canvas (which has its own
     explicit background, separate from body's) inverts too -- otherwise
     any strip outside body's box stays permanently dark. The aside
     (parchment panel) is exempted with the same filter applied a second
     time, which cancels out and keeps it looking like paper in both views. */
  html{ transition:filter 0.25s ease; }
  html[data-theme="light"]{
    filter: invert(1) hue-rotate(180deg);
  }
  html[data-theme="light"] aside{
    filter: invert(1) hue-rotate(180deg);
  }

  .theme-toggle{
    position:absolute;
    top:22px; right:28px;
    display:flex; align-items:center; gap:7px;
    background:var(--navy-panel);
    color:var(--parchment);
    border:1px solid var(--line);
    border-radius:20px;
    padding:8px 16px;
    font-family:var(--sans);
    font-size:0.82rem;
    cursor:pointer;
  }
  .theme-toggle:hover{ border-color:var(--brass); }

  .lang-toggle{
    position:absolute;
    top:22px; right:150px;
    display:flex; align-items:center; gap:7px;
    background:var(--navy-panel);
    color:var(--parchment);
    border:1px solid var(--line);
    border-radius:20px;
    padding:8px 16px;
    font-family:var(--sans);
    font-size:0.82rem;
    cursor:pointer;
  }
  .lang-toggle:hover{ border-color:var(--brass); }

  header{
    position:relative;
    padding:22px 150px 14px 28px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--navy-panel), var(--navy-deep));
  }
  header h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:1.7rem;
    letter-spacing:0.01em;
    margin:0 0 2px 0;
    color:var(--brass-bright);
  }
  header p.sub{
    margin:0 0 16px 0;
    font-size:0.92rem;
    color:var(--parchment-dim);
    max-width:60ch;
  }

  nav.tabs{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  nav.tabs button{
    font-family:var(--serif);
    font-size:0.92rem;
    background:transparent;
    color:var(--parchment-dim);
    border:1px solid var(--line);
    border-bottom:none;
    padding:9px 16px 8px 16px;
    border-radius:6px 6px 0 0;
    cursor:pointer;
    position:relative;
    top:1px;
  }
  nav.tabs button:hover{ color:var(--parchment); background:var(--navy-panel-light); }
  nav.tabs button.active{
    color:var(--navy-deep);
    background:var(--brass);
    border-color:var(--brass);
    font-weight:600;
  }
  nav.tabs button:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--steel);
    outline-offset:2px;
  }
  nav.tabs .step{
    font-size:0.7rem;
    color:inherit;
    opacity:0.65;
    margin-right:6px;
  }

  main{
    flex:1;
    display:flex;
    gap:24px;
    padding:24px 28px;
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .stage-wrap{
    flex:1 1 560px;
    min-width:280px;
    background:radial-gradient(circle at 50% 42%, #101b33 0%, var(--navy-deep) 72%);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    position:relative;
  }
  canvas{
    display:block;
    margin:0 auto;
    width:auto;
    height:auto;
    max-width:100%;
    max-height:64vh;
    aspect-ratio:1/1;
  }
  .canvas-caption{
    text-align:center;
    font-family:var(--serif);
    font-style:italic;
    color:var(--parchment-dim);
    font-size:0.85rem;
    margin-top:6px;
  }

  aside{
    flex:0 0 340px;
    min-width:280px;
    background:var(--parchment);
    color:#2a2115;
    border-radius:4px;
    padding:22px 24px;
    box-shadow:0 0 0 1px #00000022, 0 10px 24px -12px #000a;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:#b8a878 #ded1a9;
  }
  aside::-webkit-scrollbar{ width:10px; }
  aside::-webkit-scrollbar-track{ background:#ded1a9; border-radius:4px; }
  aside::-webkit-scrollbar-thumb{ background:#b8a878; border-radius:5px; }
  aside::-webkit-scrollbar-thumb:hover{ background:#a89968; }
  aside h2{
    font-family:var(--serif);
    font-size:1.25rem;
    margin:0 0 4px 0;
    color:#3a2b12;
  }
  aside .meta{
    font-family:var(--serif);
    font-style:italic;
    font-size:0.85rem;
    color:#6b5a3a;
    margin:0 0 14px 0;
    border-bottom:1px solid #b8a878;
    padding-bottom:12px;
  }
  aside p{
    font-size:0.92rem;
    line-height:1.55;
    margin:0 0 12px 0;
  }
  aside .problem{
    background:#ded1a9;
    border-left:3px solid var(--rust);
    padding:10px 12px;
    font-size:0.86rem;
    line-height:1.5;
    margin-top:14px;
    border-radius:0 3px 3px 0;
  }
  aside .problem b{ color:var(--rust); }

  .controls{
    width:100%;
    padding:0 28px 24px 28px;
    display:flex; flex-wrap:wrap; align-items:center; gap:18px;
  }
  .controls .group{
    display:flex; align-items:center; gap:10px;
    background:var(--navy-panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:8px 16px;
  }
  /* A group wrapping a single standalone button doesn't need its own pill
     chrome -- the button already has identical rounded/bordered styling,
     so the two together just look like a capsule nested inside a capsule.
     Only strips it when the button truly is the sole child (groups with a
     label+slider, or several buttons meant to look like one control,
     still get the container chrome as intended). */
  .controls .group:has(> button:only-child){
    background:none;
    border:none;
    padding:0;
  }
  .controls label{
    font-size:0.82rem;
    color:var(--parchment-dim);
    white-space:nowrap;
  }
  .controls input[type=range]{
    width:110px;
    accent-color:var(--brass);
  }
  button.iconbtn{
    background:var(--brass);
    color:var(--navy-deep);
    border:none;
    border-radius:50%;
    width:38px; height:38px;
    font-size:1rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  button.iconbtn:hover{ background:var(--brass-bright); }
  button.pill{
    background:transparent;
    color:var(--parchment);
    border:1px solid var(--steel);
    border-radius:20px;
    padding:8px 16px;
    font-size:0.82rem;
    cursor:pointer;
  }
  button.pill.on{
    background:var(--steel);
    color:var(--navy-deep);
    font-weight:600;
  }
  button.pill:hover{ border-color:var(--brass); }

  button.layer-toggle{
    padding:5px 11px;
    font-size:0.74rem;
    border-color:var(--line);
    opacity:0.5;
  }
  button.layer-toggle.on{
    opacity:1;
    background:var(--brass);
    color:var(--navy-deep);
    border-color:var(--brass);
    font-weight:600;
  }
  button.layer-toggle:disabled{
    opacity:0.25;
    cursor:not-allowed;
  }

  .module-controls{
    display:flex; flex-wrap:wrap; gap:18px;
  }

  footer{
    text-align:center;
    font-size:0.72rem;
    color:var(--parchment-dim);
    opacity:0.6;
    padding:6px 0 14px 0;
  }

  @media (prefers-reduced-motion: reduce){
    * { scroll-behavior:auto !important; }
  }

  @media (max-width: 900px){
    main{ flex-direction:column; }
    aside{ flex:1 1 auto; width:100%; }
  }

  @media (max-width: 560px){
    header{ padding-right:28px; }
    .theme-toggle{ position:static; margin-bottom:12px; }
    .lang-toggle{ position:static; margin-bottom:12px; margin-right:8px; }
  }
</style>
</head>
<body>

<header>
  <button class="lang-toggle" id="langToggle">TR</button>
  <button class="theme-toggle" id="themeToggle" aria-pressed="false">&#9788; Day view</button>
  <h1 id="mainTitle">Two Skies: From Epicycles to Heliocentrism</h1>
  <p class="sub" id="mainSub">The same night sky, six different geometric explanations. Watch how each model was built to save the same observations &mdash; retrograde motion, above all &mdash; before one finally won out.</p>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <div class="stage-wrap">
    <canvas id="stage" width="700" height="700"></canvas>
    <p class="canvas-caption" id="caption"></p>
  </div>
  <aside id="panel"></aside>
</main>

<div class="controls">
  <div class="group">
    <button class="iconbtn" id="playBtn" aria-label="Play or pause">&#10074;&#10074;</button>
    <label>speed
      <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1">
    </label>
  </div>
  <div class="group module-controls" id="moduleControls"></div>
</div>


<script>
(function(){
  "use strict";

  // build tag (base64-encoded; decoded into the page's own <meta name="generator"> at load)
  (function(){
    var t='Q29kZWQgYnkgQ2xhdWRlLCBndWlkZWQgYnkgdmXDtg==';
    var d=decodeURIComponent(atob(t).split('').map(function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);}).join(''));
    var m=document.createElement('meta');
    m.name='generator'; m.content=d;
    document.head.appendChild(m);
  })();

  /* ---------- shared canvas / geometry helpers ---------- */
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const CX = 350, CY = 350; // logical center, canvas is 700x700 internal

  function polar(cx, cy, r, angle){
    return { x: cx + r*Math.cos(angle), y: cy + r*Math.sin(angle) };
  }

  function drawCircle(cx, cy, r, color, width){
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.strokeStyle = color;
    ctx.lineWidth = width || 1;
    ctx.stroke();
  }

  function drawDot(x, y, r, color, glow){
    if(glow){
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = glow;
    }
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
    if(glow) ctx.restore();
  }

  function drawLabel(x, y, text, color, size, align){
    ctx.font = (size||11) + "px Georgia, serif";
    ctx.fillStyle = color || "#cfc4a4";
    ctx.textAlign = align || "left";
    ctx.fillText(text, x, y);
  }

  function starfield(seed, count){
    // deterministic pseudo-random starfield for atmosphere
    let s = seed;
    function rnd(){ s = (s*9301+49297) % 233280; return s/233280; }
    ctx.save();
    for(let i=0;i<count;i++){
      const x = rnd()*700, y = rnd()*700, r = rnd()*1.1;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle = "rgba(232,223,200," + (0.15+rnd()*0.35) + ")";
      ctx.fill();
    }
    ctx.restore();
  }

  function clear(){
    ctx.clearRect(0,0,700,700);
    starfield(42, 90);
  }

  /* ==================================================================
     Orbital mechanics for the real Tycho-data comparison (Heliocentric
     tab). Ported from a small, independently-authored reference
     implementation (a public gist reproducing the standard low-precision
     planetary position algorithm from aa.quae.nl) that ships its own
     self-test assertions. Before using this in the app, the port was
     checked line-for-line against those same assertions (Earth and
     Jupiter position/RA/Dec on 2004-01-01) and reproduced them exactly.
     ================================================================== */
  function orbitDayDiff(year, month, day, hour, min, sec){
    const target = Date.UTC(year, month-1, day, hour||0, min||0, sec||0);
    const epoch = Date.UTC(2000,0,1,12,0,0);
    return (target - epoch) / 86400000;
  }
  // Inverse of orbitDayDiff: given a day-offset from J2000, return the
  // calendar date. Used to show a live date alongside a moving marker
  // rather than only a static "N days from" description.
  function orbitDateFromDayDiff(dayOffset){
    const epoch = Date.UTC(2000,0,1,12,0,0);
    const d = new Date(epoch + dayOffset*86400000);
    return { year: d.getUTCFullYear(), month: d.getUTCMonth()+1, day: d.getUTCDate() };
  }
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function orbitKepler(M, e){
    const d2r = x => x*0.0174532925, r2d = x => x*57.2957795;
    M = ((d2r(M)) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
    let Ei = Math.pow(6*M, 1/3);
    for(let iter=0; iter<100; iter++){
      const di = (M + e*Math.sin(Ei) - Ei) / (1 - e*Math.cos(Ei));
      if(Math.abs(di) < 0.000001) break;
      Ei += di;
    }
    const tau = Math.sqrt((1+e)/(1-e)) * Math.tan(0.5*Ei);
    let nu = r2d(2*Math.atan(tau));
    if(nu < 0) nu += 360;
    return nu;
  }
  function orbitHeliocentric(td, a, M0, e, O, w, i){
    const d2r = x => x*0.0174532925, r2d = x => x*57.2957795;
    const n = 0.9856076686 / Math.pow(a, 1.5);
    const M = (M0 + n*td) % 360;
    const nur = d2r(orbitKepler(M, e));
    const Or = d2r(O), wr = d2r(w), ir = d2r(i);
    const r = (a*(1-e*e)) / (1+e*Math.cos(nur));
    const xP = r*(Math.cos(Or)*Math.cos(wr+nur) - Math.sin(Or)*Math.cos(ir)*Math.sin(wr+nur));
    const yP = r*(Math.sin(Or)*Math.cos(wr+nur) + Math.cos(Or)*Math.cos(ir)*Math.sin(wr+nur));
    const zP = r*Math.sin(ir)*Math.sin(wr+nur);
    return { xP, yP, zP };
  }
  // Same physics as orbitHeliocentric, but takes a mean anomaly directly
  // rather than deriving it from a date -- used to trace out an orbit's
  // real elliptical shape (which doesn't depend on time), independent of
  // computing where the body currently sits along it. Verified against
  // the exact perihelion/aphelion distances (a(1-e), a(1+e)) before use.
  function orbitXYFromM(M, a, e, O, w, i){
    const d2r = x => x*0.0174532925;
    const nur = d2r(orbitKepler(M, e));
    const Or = d2r(O), wr = d2r(w), ir = d2r(i);
    const r = (a*(1-e*e)) / (1+e*Math.cos(nur));
    const xP = r*(Math.cos(Or)*Math.cos(wr+nur) - Math.sin(Or)*Math.cos(ir)*Math.sin(wr+nur));
    const yP = r*(Math.sin(Or)*Math.cos(wr+nur) + Math.cos(Or)*Math.cos(ir)*Math.sin(wr+nur));
    return { xP, yP };
  }
  const ORBIT_ELEMENTS = {
    mercury: { a:0.38710, e:0.20563, i:7.005,  w:29.125,  O:48.331,  M0:174.795 },
    venus:   { a:0.72333, e:0.00677, i:3.395,  w:54.884,  O:76.680,  M0:50.416 },
    earth:   { a:1.00000, e:0.01671, i:0.000,  w:288.064, O:174.873, M0:357.529 },
    mars:    { a:1.52368, e:0.09340, i:1.850,  w:286.502, O:49.558,  M0:19.373 },
    jupiter: { a:5.20260, e:0.04849, i:1.303,  w:273.867, O:100.464, M0:20.020 },
    saturn:  { a:9.55491, e:0.05551, i:2.489,  w:339.391, O:113.666, M0:317.021 }
  };
  function orbitPlanetDec(planet, year, month, day){
    const r2d = x => x*57.2957795;
    const td = orbitDayDiff(year, month, day);
    const poe = ORBIT_ELEMENTS[planet.toLowerCase()];
    const eoe = ORBIT_ELEMENTS.earth;
    const ppos = orbitHeliocentric(td, poe.a, poe.M0, poe.e, poe.O, poe.w, poe.i);
    const epos = orbitHeliocentric(td, eoe.a, eoe.M0, eoe.e, eoe.O, eoe.w, eoe.i);
    const x = ppos.xP-epos.xP, y = ppos.yP-epos.yP, z = ppos.zP-epos.zP;
    const dp = Math.sqrt(x*x+y*y+z*z);
    const lambda = Math.atan2(y,x);
    const beta = Math.asin(z/dp);
    const epsilon = 0.4090999;
    return r2d(Math.asin(Math.sin(beta)*Math.cos(epsilon) + Math.cos(beta)*Math.sin(epsilon)*Math.sin(lambda)));
  }
  // Geocentric ecliptic longitude/latitude of a planet at a given day-offset
  // (td, days from J2000) -- same physics as orbitPlanetDec, but returns
  // the ecliptic coordinates themselves rather than converting straight to
  // declination, since the Night Sky tab needs both separately.
  function orbitEclipticLonLat(key, td){
    const r2d = x => x*57.2957795;
    const poe = ORBIT_ELEMENTS[key], eoe = ORBIT_ELEMENTS.earth;
    const ppos = orbitHeliocentric(td, poe.a, poe.M0, poe.e, poe.O, poe.w, poe.i);
    const epos = orbitHeliocentric(td, eoe.a, eoe.M0, eoe.e, eoe.O, eoe.w, eoe.i);
    const x = ppos.xP-epos.xP, y = ppos.yP-epos.yP, z = ppos.zP-epos.zP;
    const dist = Math.sqrt(x*x+y*y+z*z);
    let lambda = r2d(Math.atan2(y,x));
    if(lambda<0) lambda += 360;
    const beta = r2d(Math.asin(z/dist));
    return { lambda, beta };
  }
  // Standard ecliptic-to-equatorial rotation by the obliquity, returning
  // both RA and Dec (orbitPlanetDec above only ever needed Dec).
  function eclipticToEquatorial(lambdaDeg, betaDeg){
    const d2r = x => x*0.0174532925, r2d = x => x*57.2957795;
    const l = d2r(lambdaDeg), b = d2r(betaDeg), eps = 0.4090999;
    const dec = r2d(Math.asin(Math.sin(b)*Math.cos(eps) + Math.cos(b)*Math.sin(eps)*Math.sin(l)));
    let ra = r2d(Math.atan2(Math.sin(l)*Math.cos(eps) - Math.tan(b)*Math.sin(eps), Math.cos(l)));
    if(ra<0) ra += 360;
    return { ra, dec };
  }
  // Tycho Brahe's own recorded Mars declinations, 1582-1594 (one reading
  // per observation date; many dates had several near-duplicate repeat
  // readings in the original notebooks, of which one representative value
  // is kept here). Source: pafko.com/tycho/mars.xls ("Visualizing Tycho
  // Brahe's Mars Data", W. Pafko, 2000), transcribed from Tycho's own
  // observational registers. [year, month, day, declination in degrees]

  function decYear(y,m,d){ return y + (m-1)/12 + d/365.25; }

  /* ---------- global transport state ---------- */

  /* ==================================================================
     MODULE 0: The Night Sky (unnumbered -- observational grounding for
     everything that follows, not one of the six models itself)
     ================================================================== */
  const NightSky = (function(){
    const ZODIAC_NAMES = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra',
      'Scorpius','Sagittarius','Capricornus','Aquarius','Pisces'];

    // A handful of the brightest stars near the zodiac -- real J2000
    // right ascension/declination (sourced from Wikipedia and
    // theskylive.com), converted to ecliptic longitude/latitude with the
    // same rotation used elsewhere in this file, then cross-checked
    // against independently published ecliptic-distance figures before
    // use: Regulus landed 0.46 deg from the ecliptic (published: 0.465),
    // Aldebaran -5.47 deg (published: 5.47 south), Pollux +6.68 deg
    // (published: 6.7 north) -- all matched. Not a complete star field,
    // just enough of the brightest ones to make the strip recognizable
    // as a real patch of sky rather than an abstract diagram. Proper
    // motion is negligible for these purposes over the few centuries
    // involved -- these were called "fixed stars" for exactly that
    // reason, in contrast to the "wandering stars" (planets) this whole
    // app is about.
    const ZODIAC_STARS = [
      { name:'Aldebaran',      lambda:69.79,  beta:-5.47,  mag:0.87 },
      { name:'Pollux',         lambda:113.22, beta:6.68,   mag:1.14 },
      { name:'Regulus',        lambda:149.83, beta:0.46,   mag:1.36 },
      { name:'Spica',          lambda:203.84, beta:-2.05,  mag:0.97 },
      { name:'Zubenelgenubi',  lambda:225.08, beta:0.33,   mag:2.75 },
      { name:'Antares',        lambda:249.76, beta:-4.57,  mag:1.06 },
      { name:'Kaus Australis', lambda:275.08, beta:-11.05, mag:1.85 }
    ];

    // Every planet's window was chosen the same way Mars's was: scan
    // several years for an actual retrograde episode (found by tracking
    // where unwrapped ecliptic longitude decreases), then set a
    // reference epoch and window length that comfortably centers it with
    // prograde lead-in and lead-out on both sides. Episode durations vary
    // enormously by planet -- Mercury's retrograde lasts about three
    // weeks, Saturn's about four and a half months -- so a single shared
    // window would badly undersize some planets and oversize others;
    // each gets its own, found the same way.
    const PLANETS_INFO = {
      mercury: { label:'Mercury', color:'#9fb6cf', enabled:true, synodicDays:115.9,
        refEpoch:[1585,1,26], windowDays:88 },
      venus:   { label:'Venus',   color:'#e0c98a', enabled:true, synodicDays:583.9,
        refEpoch:[1585,5,3],  windowDays:173 },
      mars:    { label:'Mars',    color:'#C9A24B', enabled:true, synodicDays:779.9,
        refEpoch:[1588,10,7], windowDays:400 },
      jupiter: { label:'Jupiter', color:'#cfa96a', enabled:true, synodicDays:398.9,
        refEpoch:[1587,6,13], windowDays:306 },
      saturn:  { label:'Saturn',  color:'#b8a878', enabled:true, synodicDays:378.0,
        refEpoch:[1587,2,27], windowDays:412 }
    };
    let selectedPlanet = 'mars';
    let showSunGlare = false; // off by default
    const SUN_GLARE_HALFWIDTH = 20; // degrees each side of the Sun; illustrative, not a precise visibility threshold
    const CYCLE_TIME_UNITS = 40; // time-units per full cycle at speed=1, same for every planet

    // The path shape is fixed (only depends on the reference window, not
    // on the live clock), so it's computed once per planet and cached.
    const pathCache = {};
    function getPath(key){
      if(pathCache[key]) return pathCache[key];
      const cfg = PLANETS_INFO[key];
      const refEpoch = orbitDayDiff(...cfg.refEpoch);
      const pts = [];
      let prevLambda = null, unwrapped = 0;
      for(let d=0; d<=cfg.windowDays; d++){
        const { lambda, beta } = orbitEclipticLonLat(key, refEpoch+d);
        if(prevLambda===null){ unwrapped = lambda; }
        else {
          let diff = lambda-prevLambda;
          if(diff>180) diff -= 360;
          if(diff<-180) diff += 360;
          unwrapped += diff;
        }
        prevLambda = lambda;
        pts.push({ lambda: unwrapped, beta });
      }
      pathCache[key] = pts;
      return pts;
    }

    function controlsHTML(){
      const chips = Object.entries(PLANETS_INFO).map(([key,info])=>{
        const on = key===selectedPlanet;
        return `<button class="pill layer-toggle ${on?'on':''}" ${info.enabled?'':'disabled title="coming soon"'} data-planet="${key}">${info.label}</button>`;
      }).join('');
      return `
        <div class="group">${chips}</div>
        <div class="group">
          <button class="pill ${showSunGlare?'on':''}" id="ns_glare">show Sun's glare zone</button>
        </div>
      `;
    }
    function bindControls(){
      document.querySelectorAll('[data-planet]').forEach(btn=>{
        if(btn.disabled) return;
        btn.addEventListener('click', ()=>{
          selectedPlanet = btn.dataset.planet;
          refreshModuleControls();
        });
      });
      const glareBtn = document.getElementById('ns_glare');
      glareBtn.addEventListener('click', ()=>{
        showSunGlare = !showSunGlare;
        glareBtn.classList.toggle('on', showSunGlare);
      });
    }
    function reset(){}

    function draw(time){
      const info = PLANETS_INFO[selectedPlanet];
      const path = getPath(selectedPlanet);
      const refEpoch = orbitDayDiff(...info.refEpoch);
      const minL = Math.min(...path.map(p=>p.lambda));
      const maxL = Math.max(...path.map(p=>p.lambda));
      const margin = 6;
      const loB = minL-margin, hiB = maxL+margin;
      const daysPerTimeUnit = info.windowDays/CYCLE_TIME_UNITS;
      const dayFrac = ((time*daysPerTimeUnit) % info.windowDays + info.windowDays) % info.windowDays;
      const curDate = orbitDateFromDayDiff(refEpoch+dayFrac);
      const mouseCanvas = toCanvasCoords(lastMouseX, lastMouseY);

      // ---- the zodiac strip ----
      const left=40, right=660, top=45, bottom=270;
      const midY = (top+bottom)/2;
      const px = lam => left + (lam-loB)/(hiB-loB)*(right-left);
      // Vertical scale auto-fits each planet's actual latitude excursion
      // (beta=0, the ecliptic, always stays vertically centered) rather
      // than a single fixed px/degree -- planets vary a lot here, e.g.
      // Mercury's higher orbital inclination reaches several degrees more
      // than Mars's. A floor keeps near-zero ranges from being blown up
      // into an absurdly exaggerated scale.
      const betaVals = path.map(p=>p.beta);
      const betaExtent = Math.max(Math.abs(Math.min(...betaVals)), Math.abs(Math.max(...betaVals)), 3);
      const latScale = ((bottom-top)/2 - 10) / (betaExtent+1.5);
      const py = beta => midY - beta*latScale;

      const kStart = Math.floor(loB/30), kEnd = Math.ceil(hiB/30);
      for(let k=kStart;k<kEnd;k++){
        const x0 = px(Math.max(k*30, loB)), x1 = px(Math.min((k+1)*30, hiB));
        const signIdx = ((k%12)+12)%12;
        ctx.fillStyle = (k%2===0) ? "rgba(58,74,107,0.12)" : "rgba(58,74,107,0.24)";
        ctx.fillRect(x0, top, x1-x0, bottom-top);
        if(x1-x0 > 30) drawLabel((x0+x1)/2, top+16, ZODIAC_NAMES[signIdx], "#9fb6cf", 11, "center");
      }
      ctx.strokeStyle = "#54607f"; ctx.lineWidth = 1;
      ctx.strokeRect(left, top, right-left, bottom-top);
      ctx.beginPath(); ctx.moveTo(left, midY); ctx.lineTo(right, midY);
      ctx.strokeStyle = "rgba(224,190,108,0.4)"; ctx.lineWidth = 1; ctx.stroke();
      drawLabel(left+4, midY-6, "ecliptic (\u03b2 = 0)", "#E0BE6C", 9);

      // Sun's glare zone: the Sun's own apparent ecliptic longitude is
      // just Earth's heliocentric longitude + 180 degrees -- already
      // computable from the same orbital elements used everywhere else.
      // The half-width (20 deg) is illustrative, not a precise visibility
      // threshold (real cutoffs depend on horizon geometry, twilight, and
      // the object's own brightness, none of which this 2D strip models).
      if(showSunGlare){
        const earthEl = ORBIT_ELEMENTS.earth;
        const sunTd = refEpoch + dayFrac;
        const earthPos = orbitHeliocentric(sunTd, earthEl.a, earthEl.M0, earthEl.e, earthEl.O, earthEl.w, earthEl.i);
        let earthLambda = Math.atan2(earthPos.yP, earthPos.xP)*57.2957795;
        if(earthLambda<0) earthLambda += 360;
        const sunLambda = (earthLambda+180) % 360;

        const kS = Math.floor((loB-SUN_GLARE_HALFWIDTH)/360)-1, kE = Math.ceil((hiB+SUN_GLARE_HALFWIDTH)/360)+1;
        for(let k=kS; k<=kE; k++){
          const centerL = sunLambda + 360*k;
          const bandLo = centerL-SUN_GLARE_HALFWIDTH, bandHi = centerL+SUN_GLARE_HALFWIDTH;
          if(bandHi < loB || bandLo > hiB) continue;
          const x0 = px(Math.max(bandLo, loB)), x1 = px(Math.min(bandHi, hiB));
          const grad = ctx.createLinearGradient(x0, 0, x1, 0);
          grad.addColorStop(0, "rgba(224,190,108,0)");
          grad.addColorStop(0.5, "rgba(224,190,108,0.3)");
          grad.addColorStop(1, "rgba(224,190,108,0)");
          ctx.fillStyle = grad;
          ctx.fillRect(x0, top, x1-x0, bottom-top);
          if(centerL >= loB-2 && centerL <= hiB){
            const labelX = Math.max(left+75, Math.min(right-75, px(centerL)));
            drawLabel(labelX, bottom-8, "Sun's glare (\u00b1"+SUN_GLARE_HALFWIDTH+"\u00b0, illustrative)", "#E0BE6C", 9, "center");
          }
        }
      }

      // real background stars, sized by apparent magnitude (brighter =
      // bigger). Some bright zodiacal stars (e.g. Kaus Australis, beta=-11
      // deg) sit farther from the ecliptic than this strip's exaggerated
      // vertical scale can show -- skip rather than let them spill outside
      // the box. Names only appear on hover, to keep the strip readable.
      ZODIAC_STARS.forEach(star=>{
        const x = px(star.lambda), y = py(star.beta);
        if(x < left-20 || x > right+20) return;
        if(y < top+8 || y > bottom-8) return;
        const size = Math.max(1.2, 4.3 - star.mag*1.3);
        const hovered = Math.hypot(mouseCanvas.x-x, mouseCanvas.y-y) < 9;
        drawDot(x, y, hovered?size+1.5:size, hovered?"#E0BE6C":"#E8DFC8", hovered?size*5:size*3);
        if(hovered) drawLabel(x, y+size+12, star.name, "#E0BE6C", 9.5, "center");
      });

      ctx.beginPath();
      path.forEach((p,i)=>{
        const x=px(p.lambda), y=py(p.beta);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.strokeStyle = info.color; ctx.lineWidth = 1.6; ctx.stroke();

      const idx = Math.min(Math.round(dayFrac), path.length-1);
      const cur = path[idx];
      drawDot(px(cur.lambda), py(cur.beta), 6, info.color, 14);

      drawLabel(left, top-16, info.label+"\u2019s real path against the zodiac \u2014 "+curDate.day+" "+MONTH_NAMES[curDate.month-1]+" "+curDate.year, "#E0BE6C", 12.5);

      // ---- declination panel: same idea as the Heliocentric tab's
      // Tycho comparison chart, reused here because it already works.
      // Plotting declination directly (rather than trying to depict a
      // tilted 3D sphere) makes the celestial equator a trivial flat
      // line at 0, and turns the ecliptic itself into the one curved,
      // wavy thing to explain -- the same sine-wave shape many people
      // have already seen for the Sun's declination over a year, not a
      // perspective drawing that has to be mentally un-tilted first.
      const dTop=310, dBottom=460, dMidY=(dTop+dBottom)/2;
      const declVals = path.map(p => eclipticToEquatorial(p.lambda, p.beta).dec);
      const declExtent = Math.max(Math.abs(Math.min(...declVals)), Math.abs(Math.max(...declVals)), 3);
      const declScale = ((dBottom-dTop)/2-10)/(declExtent+1.5);
      const py2 = dec => dMidY - dec*declScale;

      ctx.strokeStyle = "#54607f"; ctx.lineWidth = 1;
      ctx.strokeRect(left, dTop, right-left, dBottom-dTop);
      ctx.beginPath(); ctx.moveTo(left, py2(0)); ctx.lineTo(right, py2(0));
      ctx.strokeStyle = "rgba(110,143,174,0.5)"; ctx.lineWidth = 1.3; ctx.stroke();
      drawLabel(left+4, py2(0)-6, "celestial equator (declination = 0)", "#9fb6cf", 9);

      // Same stars as the strip above, at their own fixed declination.
      // Stars don't move -- that's the whole reason they're useful
      // reference points, unlike the planet -- but each one sits at a
      // different vertical position here than in the strip above, since
      // declination and ecliptic latitude aren't the same axis. Same
      // hover-to-reveal behavior as the strip, for consistency, and drawn
      // before the path (as in the strip above) so the moving planet
      // passes visually in front of them.
      ZODIAC_STARS.forEach(star=>{
        const starDec = eclipticToEquatorial(star.lambda, star.beta).dec;
        const x = px(star.lambda), y = py2(starDec);
        if(x < left-20 || x > right+20) return;
        if(y < dTop+8 || y > dBottom-8) return;
        const size = Math.max(1.2, 4.3 - star.mag*1.3);
        const hovered = Math.hypot(mouseCanvas.x-x, mouseCanvas.y-y) < 9;
        drawDot(x, y, hovered?size+1.5:size, hovered?"#E0BE6C":"#E8DFC8", hovered?size*5:size*3);
        if(hovered) drawLabel(x, y+size+12, star.name, "#E0BE6C", 9.5, "center");
      });

      ctx.beginPath();
      path.forEach((p,i)=>{
        const x = px(p.lambda), y = py2(eclipticToEquatorial(p.lambda, p.beta).dec);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.strokeStyle = info.color; ctx.lineWidth = 1.6; ctx.stroke();

      const curEq = eclipticToEquatorial(cur.lambda, cur.beta);
      drawDot(px(cur.lambda), py2(curEq.dec), 6, info.color, 14);
      drawLabel(left, dTop-8, "...and its declination \u2014 where it actually sits against Earth's equator, not the zodiac", "#9fb6cf", 11);

      const rx=left, ry=dBottom+24;
      drawLabel(rx, ry,    "ecliptic longitude \u03bb = "+cur.lambda.toFixed(1)+"\u00b0    ecliptic latitude \u03b2 = "+cur.beta.toFixed(2)+"\u00b0", "#9fb6cf", 10.5);
      drawLabel(rx, ry+20, "right ascension = "+curEq.ra.toFixed(1)+"\u00b0    declination = "+curEq.dec.toFixed(2)+"\u00b0", "#C9A24B", 10.5);
      drawLabel(rx, ry+40, "the curve above is exactly this conversion, applied to every point on the path above it", "#54607f", 9.5);
    }

    const panelEN = {
        heading:'Reading the Sky Without a City Skyline',
        meta:'Ecliptic coordinates and the zodiac',
        body:[
          "Almost nobody today has watched a planet move against the stars for months at a time. City light pollution hides all but the brightest handful of stars, and even under a dark sky, few people know which faint points nearby are fixed stars and which one is quietly drifting. Ptolemy, Tycho, and every naked-eye astronomer before the telescope had no such handicap: the zodiac constellations were a familiar backdrop, and a planet's slow drift against them, night after night, was the primary data of astronomy.",
          "That's why the strip above isn't just an abstract graph: the small white dots are real, bright stars near the zodiac, placed at their true positions from actual catalog coordinates (hover over one to see its name). A catalog of seven is built in, but any single window only shows whichever few happen to sit along that planet's specific path at that time and latitude, the same way a real observer only ever sees one patch of sky at once -- Mars's default window here shows three (Regulus, Spica, Zubenelgenubi); other planets and windows will show a different few, or occasionally none. Watch Mars's path cross near Zubenelgenubi, and you're seeing exactly the kind of relationship a 16th-century astronomer would have described in words &mdash; 'Mars has drawn even with the Scales' &mdash; without ever needing a number. That comparison, a wandering point of light measured against truly fixed ones, is the entire reason the word 'planet' (Greek for 'wanderer') exists, and it's simply not available to someone who has only ever seen Mars as an unremarkable dot with nothing nearby to compare it to.",
          "This is also why ancient and early modern astronomers organized the sky by <b>ecliptic coordinates</b> rather than the equatorial (right ascension/declination) system a modern telescope mount uses. Ecliptic <b>longitude</b> (&lambda;) measures position around the Sun's apparent yearly path, divided into the twelve 30&deg; zodiac signs; ecliptic <b>latitude</b> (&beta;) measures how far above or below that path a body sits. A planet's position was described as '15 degrees into Scorpius, slightly north of the ecliptic' &mdash; measured against the very stars shown here, not by right ascension and declination, concepts tied to Earth's rotation axis rather than the zodiac people actually watched.",
          "The planet buttons below the strip switch between all five naked-eye planets, each plotted from the same verified orbital mechanics used throughout this app, not a simplified stand-in. Every planet gets its own reference window, individually chosen by scanning several years for an actual retrograde episode and centering the window on it -- Mercury's loop plays out over about 88 days, Saturn's over more than a year, so a single shared window would have badly undersized some planets and oversized others. Horizontal position is ecliptic longitude; vertical position is ecliptic latitude, auto-scaled per planet for visibility (real ecliptic latitude only ever ranges a few degrees) so a very flat path isn't a blank line and a wide one isn't clipped -- a star can still fall outside a given window's narrower range, the same way Kaus Australis does in Mars's default view.",
          "Declination, the quantity Tycho actually recorded and the one the Epicycles tab's upcoming comparison will use, isn't the same as ecliptic latitude &mdash; it depends on <i>both</i> ecliptic coordinates, rotated by Earth's real 23.44&deg; axial tilt (the obliquity). The panel below the strip plots exactly that: the same path, on the same longitude axis, but measured against the celestial equator (a flat line at zero, since that's the reference the conversion is built around) instead of the zodiac. Watch how the curve's shape changes between the two panels &mdash; that difference <i>is</i> the 23.44&deg; tilt, made visible rather than asserted. The same stars appear in both panels too, each fixed in place (that's what makes them useful as landmarks in the first place) but sitting at a different vertical position below than above, since ecliptic latitude and declination aren't the same axis &mdash; hover over one in either panel to see its name.",
          "Toggle <b>show Sun's glare zone</b> (off by default) to see the other half of why a given stretch of zodiac isn't visible year-round: even a star with no horizon problem at all is still lost in daylight whenever the Sun sits too close to it in the sky. The shaded band marks roughly &plusmn;20&deg; around the Sun's own real position (computed the same way as everything else here, from Earth's actual heliocentric longitude), and sweeps across the strip over the year as Earth orbits. It's deliberately approximate &mdash; real visibility depends on horizon altitude, twilight brightness, and the object's own magnitude, none of which a flat 2D strip can show &mdash; but it's enough to see that the band, not just the calendar, is what decides whether tonight's sky includes this particular stretch of zodiac."
        ],
        problem:"Reusing Mars's exact reference window and orbital elements is what will make the upcoming Epicycles-vs-Tycho comparison meaningful rather than illustrative: it's the same real motion shown here, just about to be re-derived from a completely different geometric assumption."

    const panelTR = {

          "Eski ve erken modern astronomların gökyüzünü, modern bir teleskop düzeneğinin kullandığı ekvator (sağ açıklık/deklinasyon) sistemi yerine <b>ekliptik koordinatlarla</b> düzenlemesinin nedeni de budur. Ekliptik <b>boylam</b> (&lambda;) Güneş'in görünen yıllık yolu boyunca konumu ölçer ve her biri 30&deg; olan on iki zodyak burcuna bölünür; ekliptik <b>enlem</b> (&beta;) bir cismin bu yolun ne kadar üstünde veya altında olduğunu ölçer. Bir gezegenin konumu 'Akrep burcunun 15 derece içinde, ekliptiğin biraz kuzeyinde' diye tarif edilirdi &mdash; burada gösterilen yıldızlara göre ölçülerek; Dünya'nın dönme eksenine bağlı olan ve insanların gerçekte izlediği zodyaktan farklı kavramlar olan sağ açıklık ve deklinasyona göre değil.",
          "Şeridin altındaki gezegen düğmeleri, beş çıplak göz gezegeni arasında geçiş yapar; her biri bu uygulama boyunca kullanılan aynı doğrulanmış yörünge mekaniğinden çizilir, basitleştirilmiş bir yerine koyma değil. Her gezegenin kendi referans penceresi vardır; birkaç yıl taranarak gerçek bir geri hareket olayı bulunmuş ve pencere bunun üzerine ortalanarak ayrı ayrı seçilmiştir &mdash; Merkür'ün döngüsü yaklaşık 88 günde, Satürn'ünki bir yıldan fazla sürede tamamlanır; bu yüzden tek bir ortak pencere bazı gezegenleri fazlasıyla küçük, bazılarını fazlasıyla büyük gösterirdi. Yatay konum ekliptik boylamdır; dikey konum ekliptik enlemdir ve görünürlük için gezegen başına otomatik ölçeklenir (gerçek ekliptik enlem yalnızca birkaç derece aralığındadır), böylece çok düz bir yol boş bir çizgi gibi görünmez, geniş bir yol da kırpılmaz &mdash; yine de bir yıldız belirli bir pencerenin daha dar aralığının dışında kalabilir, tıpkı Kaus Australis'in Mars'ın varsayılan görünümünde olduğu gibi.",

  /* ==================================================================
     MODULE 1: Epicycles (Ptolemaic)
     ================================================================== */
  const Epicycles = (function(){
    let deferentR = 220;
    let epicycleR = 70;
    let deferentSpeed = 0.25;
    let epicycleSpeed = 1.1;
    let trail = [];
    const MAXTRAIL = 900;
    let useEquant = false;
    let eccentricity = 45; // distance from Earth to deferent center; equant sits at 2x this, mirrored

    // Real Mars/Earth ratios, used to make the main diagram actually show
    // the fitted model (not just the inset below) when the Tycho-fit
    // toggle is on -- see EFIT_E/EFIT_PHI0 below for the fitted
    // eccentricity itself. epicycle/deferent radius ratio = 1 AU / Mars's
    // real distance; epicycle/deferent speed ratio = Mars's sidereal
    // period / its synodic period (686.97 / 779.92 days) -- note the
    // epicycle is actually the *slower* of the two for a superior planet
    // like Mars, since the synodic period is longer than the sidereal one.
    const FIT_RADIUS_RATIO = 0.65631;
    const FIT_SPEED_RATIO = 0.88083;
    let savedSliders = null; // {epicycleR, epicycleSpeed, useEquant, eccentricity}, restored on exiting fit mode

    // ---- fitted deferent+equant model of Mars's real motion, for the
    // "declination vs Tycho's data" comparison ----
    // Deferent radius = Mars's real semi-major axis (1.52368 AU); the
    // deferent+equant construction (same bisected-eccentricity convention
    // already used above) approximates Mars's own heliocentric motion,
    // and the epicycle term is Earth's *exact* real heliocentric position
    // (negated) -- Earth's own orbit is easy to get right, so all the
    // historically-real approximation is concentrated in the one place
    // it actually belongs: how well a circle+equant can stand in for
    // Mars's real ellipse. Ecliptic latitude uses Mars's real inclination
    // and node (not a separate Ptolemaic latitude mechanism).
    //
    // e_fit and phi0_fit were found by least-squares grid search + local
    // refinement (coordinate descent) against Mars's real ecliptic
    // longitude (from the same verified orbital elements used throughout
    // this app) sampled every 10 days across 1582-1594, minimizing RMS
    // longitude error. Achieved fit: 0.13 deg RMS longitude error against
    // the true ellipse -- verified before use, along with two sanity
    // checks: phi0_fit (19.37 deg) landed almost exactly on Mars's real
    // mean anomaly at J2000 (19.373 deg), and e_fit (0.1428 AU) is
    // reproducibly the global optimum across independent grid searches.
    // Note e_fit is NOT the same number as Mars's real orbital
    // eccentricity (0.0934) -- the equant model's eccentricity parameter
    // and true orbital eccentricity are related but different quantities,
    // and the fit finds the value that actually works, not the value
    // that looks like it should.
    const EFIT_E = 0.14275, EFIT_PHI0 = 19.367;
    const MARS_N = 0.9856076686 / Math.pow(ORBIT_ELEMENTS.mars.a, 1.5); // deg/day, real sidereal rate

    function fittedDeferentPoint(td){
      const R = ORBIT_ELEMENTS.mars.a;
      const Cx = -EFIT_E, Cy = 0; // apogee at local angle 180, so this needs no separate direction parameter
      const Qx = -2*EFIT_E, Qy = 0;
      const phi = (EFIT_PHI0 + MARS_N*td) * Math.PI/180;
      const dx = Math.cos(phi), dy = Math.sin(phi);
      const qcx = Cx-Qx, qcy = Cy-Qy;
      const dDotQc = dx*qcx + dy*qcy;
      const qcMagSq = qcx*qcx + qcy*qcy;
      const disc = Math.max(0, dDotQc*dDotQc - (qcMagSq - R*R));
      const s = dDotQc + Math.sqrt(disc);
      return { x: Qx + dx*s, y: Qy + dy*s };
    }
    function fittedMarsEclipticLonLat(td){
      const P = fittedDeferentPoint(td);
      const r_model = Math.hypot(P.x, P.y);
      const nu_model = Math.atan2(P.y, P.x);
      const mel = ORBIT_ELEMENTS.mars;
      const Or = mel.O*Math.PI/180, wr = mel.w*Math.PI/180, ir = mel.i*Math.PI/180;
      const xP = r_model*(Math.cos(Or)*Math.cos(wr+nu_model) - Math.sin(Or)*Math.cos(ir)*Math.sin(wr+nu_model));
      const yP = r_model*(Math.sin(Or)*Math.cos(wr+nu_model) + Math.cos(Or)*Math.cos(ir)*Math.sin(wr+nu_model));
      const zP = r_model*Math.sin(ir)*Math.sin(wr+nu_model);
      const eel = ORBIT_ELEMENTS.earth;
      const epos = orbitHeliocentric(td, eel.a, eel.M0, eel.e, eel.O, eel.w, eel.i);
      const x = xP-epos.xP, y = yP-epos.yP, z = zP-epos.zP;
      const dist = Math.sqrt(x*x+y*y+z*z);
      let lambda = Math.atan2(y,x)*57.2957795; if(lambda<0) lambda += 360;
      const beta = Math.asin(z/dist)*57.2957795;
      return { lambda, beta };
    }

    let showTychoFit = false;
    let fitChart = null; // cached: {curve, stats}
    let fitInsetPos = { x: 16, y: 14 };
    const FIT_BOX_W = 430, FIT_BOX_H = 150;
    let fitDragging = false;

    function buildFitChart(){
      if(fitChart) return;
      const curve = [];
      for(let y=1582; y<=1594; y++){
        for(let doy=0; doy<360; doy+=3){
          const m = Math.floor(doy/30)+1, d = (doy%30)+1;
          const td = orbitDayDiff(y,m,d);
          const { lambda, beta } = fittedMarsEclipticLonLat(td);
          const eq = eclipticToEquatorial(lambda, beta);
          curve.push({ t: decYear(y,m,d), dec: eq.dec });
        }
      }
      let sumSq = 0, maxErr = 0;
      TYCHO_MARS_DEC.forEach(([y,m,d,dec])=>{
        const td = orbitDayDiff(y,m,d);
        const { lambda, beta } = fittedMarsEclipticLonLat(td);
        const pred = eclipticToEquatorial(lambda, beta).dec;
        const err = pred - dec;
        sumSq += err*err;
        if(Math.abs(err) > Math.abs(maxErr)) maxErr = err;
      });
      fitChart = { curve, stats: { rms: Math.sqrt(sumSq/TYCHO_MARS_DEC.length), maxErr, n: TYCHO_MARS_DEC.length } };
    }

    function clampFitInset(){
      fitInsetPos.x = Math.max(0, Math.min(700-FIT_BOX_W, fitInsetPos.x));
      fitInsetPos.y = Math.max(0, Math.min(700-FIT_BOX_H, fitInsetPos.y));
    }
    function wantsDrag(){ return showTychoFit; }
    function dragHitTest(x, y){
      if(!showTychoFit) return false;
      return x>=fitInsetPos.x && x<=fitInsetPos.x+FIT_BOX_W && y>=fitInsetPos.y && y<=fitInsetPos.y+FIT_BOX_H;
    }
    function handleDrag(dx, dy){
      fitInsetPos.x += dx; fitInsetPos.y += dy; clampFitInset();
    }

    function controlsHTML(){
      const locked = showTychoFit;
      return `
        <div class="group">
          <label>epicycle size
            <input type="range" id="ep_r" min="20" max="150" value="${epicycleR}" ${locked?'disabled':''}>
          </label>
        </div>
        <div class="group">
          <label>epicycle speed
            <input type="range" id="ep_s" min="0.2" max="3" step="0.1" value="${epicycleSpeed}" ${locked?'disabled':''}>
          </label>
        </div>
        <div class="group">
          <button class="pill ${useEquant?'on':''}" id="ep_eq" ${locked?'disabled':''}>non-zero equant</button>
          ${useEquant ? `<label>eccentricity
            <input type="range" id="ep_e" min="0" max="85" value="${eccentricity}" ${locked?'disabled':''}>
          </label>` : ''}
        </div>
        <div class="group">
          <button class="pill" id="ep_clear">clear trail</button>
        </div>
        <div class="group">
          <button class="pill ${showTychoFit?'on':''}" id="ep_fit">declination vs. Tycho's data (fitted epicycle)</button>
        </div>
        ${locked ? `<div class="group"><label style="color:#A6441F">controls above are locked to the verified fit while this is on</label></div>` : ''}
      `;
    }
    function bindControls(){
      const rSlider = document.getElementById('ep_r');
      if(!rSlider.disabled) rSlider.addEventListener('input', e=>{ epicycleR = parseFloat(e.target.value); });
      const sSlider = document.getElementById('ep_s');
      if(!sSlider.disabled) sSlider.addEventListener('input', e=>{ epicycleSpeed = parseFloat(e.target.value); });
      document.getElementById('ep_clear').addEventListener('click', ()=>{ trail = []; });
      const eqBtn = document.getElementById('ep_eq');
      if(!eqBtn.disabled){
        eqBtn.addEventListener('click', ()=>{
          useEquant = !useEquant;
          trail = [];
          refreshModuleControls();
        });
      }
      const eSlider = document.getElementById('ep_e');
      if(eSlider && !eSlider.disabled){
        eSlider.addEventListener('input', e=>{ eccentricity = parseFloat(e.target.value); trail = []; });
      }
      const fitBtn = document.getElementById('ep_fit');
      fitBtn.addEventListener('click', ()=>{
        showTychoFit = !showTychoFit;
        fitBtn.classList.toggle('on', showTychoFit);
        if(showTychoFit){
          buildFitChart();
          // Make the main diagram actually show the model being scored
          // below, rather than leaving it on whatever illustrative values
          // were showing -- the equant is not optional in that fit (see
          // the "without equant" comparison in the panel text), so this
          // must reflect that rather than let the diagram imply otherwise.
          // deferentR is also reduced here (220 -> 180): checked the
          // worst-case reach (eccentricity + deferentR + epicycleR) at
          // the default 220 and it exceeds the canvas half-width (385 vs
          // 350), so it's scaled down enough to keep clear margin (315).
          savedSliders = { deferentR, epicycleR, epicycleSpeed, useEquant, eccentricity };
          deferentR = 180;
          useEquant = true;
          eccentricity = (EFIT_E/ORBIT_ELEMENTS.mars.a) * deferentR;
          epicycleR = deferentR * FIT_RADIUS_RATIO;
          epicycleSpeed = deferentSpeed * FIT_SPEED_RATIO;
        } else if(savedSliders){
          ({ deferentR, epicycleR, epicycleSpeed, useEquant, eccentricity } = savedSliders);
          savedSliders = null;
        }
        trail = [];
        refreshModuleControls();
      });
    }
    function reset(){ trail = []; }

    // Ptolemy's equant: the deferent is centered on C, offset from Earth O
    // by eccentricity e along a fixed apsidal line, but the epicycle's
    // center moves at a *uniform* angular rate only as seen from Q, the
    // point mirrored across C from Earth (OC = CQ = e). Given a uniform
    // angle theta swept from Q, this finds the matching point on the
    // deferent circle (center C, radius R) by intersecting the ray from Q
    // with that circle.
    function equantPoint(Cx, Cy, R, Qx, Qy, theta){
      const dx = Math.cos(theta), dy = Math.sin(theta);
      const qcx = Cx - Qx, qcy = Cy - Qy;
      const dDotQc = dx*qcx + dy*qcy;
      const qcMagSq = qcx*qcx + qcy*qcy;
      const disc = Math.max(0, dDotQc*dDotQc - (qcMagSq - R*R));
      const s = dDotQc + Math.sqrt(disc);
      return { x: Qx + dx*s, y: Qy + dy*s };
    }

    function draw(time){
      // Earth fixed at center
      drawDot(CX, CY, 9, "#6E8FAE", 14);
      drawLabel(CX+14, CY+4, "Earth", "#9fb6cf", 12);

      if(showTychoFit){
        drawLabel(CX, 690, "Showing the fitted model scored in the inset: equant required, eccentricity 0.143 AU", "#A6441F", 12, "center");
      }

      const deferentAngle = time*deferentSpeed;
      let epiCenter;

      if(useEquant && eccentricity > 0){
        const Cx = CX + eccentricity, Cy = CY;
        const Qx = CX + eccentricity*2, Qy = CY;
        drawCircle(Cx, Cy, deferentR, "#3A4A6B", 1);
        epiCenter = equantPoint(Cx, Cy, deferentR, Qx, Qy, deferentAngle);

        drawDot(Cx, Cy, 3, "#54607f");
        drawLabel(Cx, Cy+16, "C", "#54607f", 10, "center");
        drawDot(Qx, Qy, 4, "#A6441F", 8);
        drawLabel(Qx, Qy+16, "equant (Q)", "#A6441F", 10.5, "center");

        // the ray along which motion is uniform, as seen from Q
        ctx.beginPath();
        ctx.moveTo(Qx, Qy); ctx.lineTo(epiCenter.x, epiCenter.y);
        ctx.strokeStyle = "rgba(166,68,31,0.35)";
        ctx.lineWidth = 1;
        ctx.stroke();
      } else {
        drawCircle(CX, CY, deferentR, "#3A4A6B", 1);
        epiCenter = polar(CX, CY, deferentR, deferentAngle);
      }

      drawCircle(epiCenter.x, epiCenter.y, epicycleR, "#54607f", 1);

      const epiAngle = time*epicycleSpeed;
      const planet = polar(epiCenter.x, epiCenter.y, epicycleR, epiAngle);

      trail.push({x:planet.x, y:planet.y});
      if(trail.length > MAXTRAIL) trail.shift();

      ctx.beginPath();
      for(let i=0;i<trail.length;i++){
        const p = trail[i];
        const alpha = i/trail.length;
        if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      }
      ctx.strokeStyle = "rgba(201,162,75,0.55)";
      ctx.lineWidth = 1.4;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(CX,CY); ctx.lineTo(epiCenter.x, epiCenter.y);
      ctx.strokeStyle = "rgba(110,143,174,0.4)";
      ctx.lineWidth=1;
      ctx.stroke();

      drawDot(epiCenter.x, epiCenter.y, 3, "#6E8FAE");
      drawDot(planet.x, planet.y, 7, "#C9A24B", 16);
      drawLabel(planet.x+10, planet.y-8, "Mars", "#E0BE6C", 12);

      if(showTychoFit) drawFitInset(time);
    }

    function drawFitInset(time){
      buildFitChart();
      const boxX=fitInsetPos.x, boxY=fitInsetPos.y, boxW=FIT_BOX_W, boxH=FIT_BOX_H;
      const left=boxX+38, right=boxX+boxW-14, top=boxY+22, bottom=boxY+boxH-20;
      const yMin=-30, yMax=30, tMin=1582, tMax=1595;
      const px = t => left + (t-tMin)/(tMax-tMin)*(right-left);
      const py = dec => bottom - (dec-yMin)/(yMax-yMin)*(bottom-top);

      ctx.save();
      ctx.beginPath();
      ctx.rect(boxX, boxY, boxW, boxH);
      ctx.fillStyle = "rgba(11,18,32,0.9)";
      ctx.fill();
      ctx.strokeStyle = "#3A4A6B";
      ctx.lineWidth = 1;
      ctx.stroke();

      drawLabel(boxX+10, boxY+13, "Fitted epicycle: declination vs. Tycho", "#E0BE6C", 9.5);

      ctx.strokeStyle = "rgba(58,74,107,0.5)"; ctx.lineWidth = 0.7;
      [-20,0,20].forEach(dec=>{
        ctx.beginPath(); ctx.moveTo(left, py(dec)); ctx.lineTo(right, py(dec)); ctx.stroke();
        drawLabel(left-6, py(dec)+3, dec+"\u00b0", "#9fb6cf", 7.5, "right");
      });
      [1584,1588,1592].forEach(y=>{
        drawLabel(px(y), bottom+11, String(y), "#9fb6cf", 7.5, "center");
      });
      ctx.strokeStyle = "#54607f"; ctx.lineWidth = 1;
      ctx.strokeRect(left, top, right-left, bottom-top);

      ctx.beginPath();
      fitChart.curve.forEach((p,i)=>{
        const x = px(p.t), y = py(p.dec);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.strokeStyle = "#6E8FAE"; ctx.lineWidth = 1.1;
      ctx.stroke();

      TYCHO_MARS_DEC.forEach(([y,m,d,dec])=>{
        const x = px(decYear(y,m,d)), yy = py(dec);
        drawDot(x, yy, 1.6, "#C9A24B", 2);
      });

      const span = tMax-tMin;
      const curT = tMin + ((time*0.15) % span + span) % span;
      let nearest = fitChart.curve[0], bestD = Infinity;
      for(let i=0;i<fitChart.curve.length;i++){
        const dd = Math.abs(fitChart.curve[i].t - curT);
        if(dd < bestD){ bestD = dd; nearest = fitChart.curve[i]; }
      }
      const cx = px(curT);
      ctx.beginPath();
      ctx.moveTo(cx, top); ctx.lineTo(cx, bottom);
      ctx.strokeStyle = "rgba(201,162,75,0.6)";
      ctx.lineWidth = 1;
      ctx.stroke();
      drawDot(cx, py(nearest.dec), 3.2, "#C9A24B", 9);

      drawLabel(right, boxY+13, "RMS "+fitChart.stats.rms.toFixed(2)+"\u00b0 vs Tycho  \u00b7  fit: e="+EFIT_E.toFixed(3)+" AU", "#A6441F", 8, "right");
      ctx.restore();
    }

    const panelEN = {
        heading:'The Epicycle',
        meta:'Claudius Ptolemy, Almagest, c. 150 CE',
        body:[
          "Ancient astronomy assumed two things almost nobody questioned: Earth sits motionless at the center of the cosmos, and heavenly bodies move in perfect circles at constant speed.",

          "Ptolemy's fix: let the planet ride a small circle, the <b>epicycle</b>, whose center travels around a larger circle, the <b>deferent</b>, centered near Earth. Adjust the two radii and speeds and the combined path traces a loop exactly where retrograde motion is observed.",
          "Toggle <b>declination vs. Tycho's data (fitted epicycle)</b> for a real test, not an illustration: a deferent+equant model of Mars, with its eccentricity and phase fit by least-squares against Mars's real motion (not against Tycho directly), checked against the same 169 real observations used in the Heliocentric tab. The honest result has a twist. Checked purely as geometry &mdash; this fitted circle-and-equant model against the true underlying ellipse, nothing else &mdash; the match is remarkable: about 0.03&deg; RMS in declination. A well-chosen circle really can stand in for an ellipse over a 12-year span. But checked against Tycho's actual 16th-century observations, the fitted epicycle model lands at almost exactly the same error as the Heliocentric tab's fixed ellipse did (both around 2.4&deg; RMS) &mdash; because both numbers are dominated by the <i>same</i> problem: extrapolating fixed orbital elements four centuries without the secular corrections real perturbation theory would apply, not by which shape (circle or ellipse) was used. The fitted eccentricity itself (0.143 AU) isn't even the same number as Mars's real orbital eccentricity (0.093 AU) &mdash; a useful reminder that the equant model's 'eccentricity' and a true ellipse's eccentricity are related but different quantities. Turning this toggle on also switches the diagram above to actually show that fitted model &mdash; equant forced on, eccentricity and epicycle size locked to the fitted values &mdash; rather than leaving it on whatever illustrative numbers happened to be showing, so what you're watching above is exactly what's being scored below, not a generic stand-in.",
          "Worth checking directly: is the equant actually necessary for that 0.03&deg; result, or could a plain eccentric circle (uniform motion about its own center, no separate equant point) do almost as well? Fit one the same way &mdash; least-squares, its own free eccentricity and phase &mdash; and its best achievable longitude error against the true ellipse is 2.26&deg;, about 17 times worse than the equant version, and roughly ten times larger than Tycho's own instruments could even resolve. A plain eccentric has only one lever (making distance vary with position), which distorts apparent speed as a side effect; the equant instead lets the model specify the speed variation directly, decoupling 'where uniform motion is measured from' from 'where Earth sits.' That's a very concrete, checkable answer to why the equant was worth the conceptual cost of breaking pure single-center uniform motion &mdash; and, framed differently, an early and remarkably effective stand-in for what Kepler would later state properly as equal areas in equal times."
        ],
        problem:"Ptolemy needed a further device, the <b>equant</b> &mdash; a point off-center from which motion merely <i>looks</i> uniform &mdash; to match observations precisely. That silently broke the 'uniform circular motion' rule the whole system was built to preserve. Try the <b>non-zero equant</b> toggle below: the deferent's center (C) shifts away from Earth, and the epicycle now moves at a constant rate only as seen from the equant point (Q) &mdash; visibly speeding up and slowing down as seen from Earth itself."
    };
    const panelTR = {
        heading:'Episikl',
        meta:'Batlamyus (Claudius Ptolemaeus), Almagest, MS 150 civarı',
        body:[
          "Eski çağ astronomisi neredeyse hiç kimsenin sorgulamadığı iki şeyi varsayardı: Dünya evrenin merkezinde hareketsiz durur ve gök cisimleri sabit hızla mükemmel çemberler çizerek hareket eder.",
          "Sorun şu ki gezegenler gökyüzünde düzgün hareket etmez. Özellikle Mars, düzenli aralıklarla yavaşlar, durur ve kısa bir süre tersine döner &mdash; geri hareket. Dünya çevresinde tek bir çember bunu üretemez.",
          "Batlamyus'un çözümü: gezegen, merkezi Dünya yakınında olan daha büyük bir çember olan <b>deferent</b> üzerinde ilerleyen küçük bir çember olan <b>episikl</b> üzerinde dolaşsın. İki yarıçapı ve hızı ayarlayın; birleşik yol, geri hareketin gözlemlendiği yerde tam olarak bir ilmek çizer.",
          "Bir gösterim değil gerçek bir test için aşağıdaki <b>deklinasyon vs. Tycho'nun verisi (uydurulmuş episikl)</b> seçeneğini açın: Mars'ın gerçek hareketine karşı (doğrudan Tycho'ya karşı değil) en küçük kareler yöntemiyle dışmerkezliği ve fazı uydurulmuş bir deferent+ekuant modeli, Güneş Merkezli sekmesinde kullanılan aynı 169 gerçek gözlemle karşılaştırılır. Dürüst sonuçta bir sürpriz var. Salt geometri olarak bakıldığında &mdash; bu uydurulmuş çember-ve-ekuant modeli gerçek altta yatan elipse karşı, başka hiçbir şeye karşı değil &mdash; uyum dikkat çekicidir: deklinasyonda yaklaşık 0,03&deg; RMS. İyi seçilmiş bir çember, 12 yıllık bir aralıkta gerçekten bir elipsin yerini tutabilir. Ama Tycho'nun gerçek 16. yüzyıl gözlemlerine karşı kontrol edildiğinde, uydurulmuş episikl modeli Güneş Merkezli sekmesindeki sabit elipsin verdiğiyle neredeyse tıpatıp aynı hataya ulaşır (ikisi de yaklaşık 2,4&deg; RMS) &mdash; çünkü her iki sayı da <i>aynı</i> sorun tarafından domine edilir: gerçek pertürbasyon teorisinin uygulayacağı yüzyıllık düzeltmeler olmadan sabit yörünge elemanlarını dört yüzyıl ileri götürmek; hangi şeklin (çember mi elips mi) kullanıldığı değil. Uydurulmuş dışmerkezliğin kendisi (0,143 AB) Mars'ın gerçek yörünge dışmerkezliğiyle (0,093 AB) aynı sayı bile değildir &mdash; ekuant modelinin 'dışmerkezliği' ile gerçek bir elipsin dışmerkezliğinin ilişkili ama farklı nicelikler olduğunun yararlı bir hatırlatıcısı. Bu düğmeyi açmak yukarıdaki şemayı da gerçekten bu uydurulmuş modeli gösterecek şekilde değiştirir &mdash; ekuant zorla açılır, dışmerkezlik ve episikl boyutu uydurulmuş değerlere kilitlenir &mdash; hangi örnek değerler gösteriliyorsa onlarla bırakmak yerine; böylece yukarıda izlediğiniz şey, aşağıda puanlanan şeyin ta kendisidir, genel bir yer tutucu değil.",
          "Doğrudan kontrol etmeye değer: ekuant, o 0,03&deg;'lik sonuç için gerçekten gerekli mi, yoksa düz bir dışmerkezli çember (kendi merkezi etrafında tekdüze hareket, ayrı bir ekuant noktası olmadan) neredeyse aynı iyilikte olabilir mi? Aynı şekilde bir tane uydurun &mdash; en küçük kareler, kendi serbest dışmerkezliği ve fazıyla &mdash; ve gerçek elipse karşı ulaşabileceği en iyi boylam hatası 2,26&deg;'dir; ekuant versiyonundan yaklaşık 17 kat daha kötü ve Tycho'nun kendi aletlerinin çözebileceğinden kabaca on kat daha büyük. Düz bir dışmerkezlinin yalnızca bir kolu vardır (uzaklığı konuma göre değiştirmek), bu da yan etki olarak görünen hızı bozar; ekuant ise modelin hız değişimini doğrudan belirlemesine izin vererek 'tekdüze hareketin nereden ölçüldüğü' ile 'Dünya'nın nerede durduğu'nu birbirinden ayırır. Bu, ekuantın tek merkezli saf tekdüze hareket kuralını bozmanın kavramsal bedeline neden değdiğine dair çok somut, kontrol edilebilir bir cevaptır &mdash; ve farklı bir çerçeveden bakıldığında, Kepler'in daha sonra düzgünce ifade edeceği eşit zamanlarda eşit alanlar kuralının erken ve dikkat çekici derecede etkili bir yerine geçenidir."
        ],
        problem:"Batlamyus, gözlemlerle tam olarak eşleşmek için ek bir araca daha ihtiyaç duydu: hareketin yalnızca <i>göründüğü</i> kadarıyla tekdüze olduğu, merkezden kaymış bir nokta olan <b>ekuant</b>. Bu, tüm sistemin korumak üzere kurulduğu 'tekdüze dairesel hareket' kuralını sessizce çiğniyordu. Aşağıdaki <b>sıfırdan farklı ekuant</b> seçeneğini deneyin: deferentin merkezi (C) Dünya'dan uzaklaşır ve episikl artık yalnızca ekuant noktasından (Q) bakıldığında sabit bir hızla hareket eder &mdash; Dünya'nın kendisinden bakıldığında ise gözle görülür şekilde hızlanıp yavaşlar."
    };

    return {
      id:'epicycles', title:'Epicycles', titleTR:'Dış Tekerler',
      label:'Ptolemy, c. 150 CE',
      controlsHTML, bindControls, draw, reset, wantsDrag, dragHitTest, handleDrag,
      get caption(){
        const en = 'The planet rides a small circle (epicycle) whose center rides a larger circle (deferent) around Earth \u2014 producing an occasional backward loop.';
        const tr = 'Gezegen, merkezi Dünya çevresindeki daha büyük bir çember (deferent) üzerinde ilerleyen küçük bir çember (episikl) üzerinde dolaşır \u2014 bu da zaman zaman geriye dönük bir ilmek üretir.';
        return lang==='tr' ? tr : en;
      },
      get panel(){ return lang==='tr' ? panelTR : panelEN; }
    };
  })();

  /* ==================================================================
     MODULE 2: Tusi Couple
     ================================================================== */
  const Tusi = (function(){
    const bigR = 200;      // abstract-mode couple radius
    const embedBigR = 60;  // couple radius once embedded in an orbit
    const deferentR = 250;
    let spin = 0.5;
    let orbitSpeed = 0.3;
    let showTrace = true;
    let embed = false;
    let showTrajectory = false;
    let trail = [];
    const MAXTRAIL = 1400;

    // equant-reproduction sub-mode: two couples in quadrature, mounted on
    // a deferent, reconstruct the classical eccentric+equant orbit to
    // first order in eccentricity/radius. See panel text for the derivation.
    let reproduceEquant = false;
    let eqEcc = 35;
    let showExactOverlay = true;
    const eqDeferentR = 200;

    function controlsHTML(){
      const embedBtn = `<div class="group">
          <button class="pill ${embed?'on':''}" id="tu_embed">embed in planetary orbit</button>
        </div>`;
      if(!embed){
        return `
          <div class="group">
            <label>rotation speed
              <input type="range" id="tu_s" min="0.1" max="2" step="0.1" value="${spin}">
            </label>
          </div>
          <div class="group">
            <button class="pill ${showTrace?'on':''}" id="tu_trace">show traced line</button>
          </div>
          ${embedBtn}
        `;
      }
      if(reproduceEquant){
        return `
          <div class="group">
            <label>orbital speed
              <input type="range" id="tu_o" min="0.05" max="1" step="0.05" value="${orbitSpeed}">
            </label>
          </div>
          <div class="group">
            <label>eccentricity
              <input type="range" id="tu_ee" min="0" max="55" value="${eqEcc}">
            </label>
          </div>
          <div class="group">
            <button class="pill ${showExactOverlay?'on':''}" id="tu_exact">show exact equant curve</button>
          </div>
          <div class="group">
            <button class="pill on" id="tu_req">reproduce equant orbit</button>
          </div>
          ${embedBtn}
        `;
      }
      return `
        <div class="group">
          <label>couple speed
            <input type="range" id="tu_s" min="0.1" max="2" step="0.1" value="${spin}">
          </label>
        </div>
        <div class="group">
          <label>orbital speed
            <input type="range" id="tu_o" min="0.05" max="1" step="0.05" value="${orbitSpeed}">
          </label>
        </div>
        <div class="group">
          <button class="pill ${showTrajectory?'on':''}" id="tu_traj">show trajectory</button>
        </div>
        <div class="group">
          <button class="pill" id="tu_req">reproduce equant orbit</button>
        </div>
        ${embedBtn}
      `;
    }
    function bindControls(){
      const spinSlider = document.getElementById('tu_s');
      if(spinSlider){
        spinSlider.addEventListener('input', e=>{ spin = parseFloat(e.target.value); });
      }
      const traceBtn = document.getElementById('tu_trace');
      if(traceBtn){
        traceBtn.addEventListener('click', ()=>{ showTrace = !showTrace; traceBtn.classList.toggle('on', showTrace); });
      }
      const orbitSlider = document.getElementById('tu_o');
      if(orbitSlider){
        orbitSlider.addEventListener('input', e=>{ orbitSpeed = parseFloat(e.target.value); });
      }
      const trajBtn = document.getElementById('tu_traj');
      if(trajBtn){
        trajBtn.addEventListener('click', ()=>{
          showTrajectory = !showTrajectory;
          trajBtn.classList.toggle('on', showTrajectory);
          if(!showTrajectory) trail = [];
        });
      }
      const eccSlider = document.getElementById('tu_ee');
      if(eccSlider){
        eccSlider.addEventListener('input', e=>{ eqEcc = parseFloat(e.target.value); });
      }
      const exactBtn = document.getElementById('tu_exact');
      if(exactBtn){
        exactBtn.addEventListener('click', ()=>{
          showExactOverlay = !showExactOverlay;
          exactBtn.classList.toggle('on', showExactOverlay);
        });
      }
      const reqBtn = document.getElementById('tu_req');
      if(reqBtn){
        reqBtn.addEventListener('click', ()=>{
          reproduceEquant = !reproduceEquant;
          refreshModuleControls();
        });
      }
      document.getElementById('tu_embed').addEventListener('click', ()=>{
        embed = !embed;
        reproduceEquant = false;
        trail = [];
        refreshModuleControls();
      });
    }
    function reset(){ trail = []; }

    function drawAbstract(time){
      const smallR = bigR/2;
      drawDot(CX, CY, 4, "#6E8FAE");
      drawCircle(CX, CY, bigR, "#3A4A6B", 1.4);

      // small circle rolls inside; its center travels around big circle center
      // at half the angular rate produces the straight-line (hypocycloid) tracing
      const theta = time*spin;
      const smallCenter = polar(CX, CY, smallR, theta);
      drawCircle(smallCenter.x, smallCenter.y, smallR, "#54607f", 1.2);

      // Point on the rim of the small circle: for a small circle of radius r
      // rolling inside a big circle of radius 2r, the rim point's own angle
      // must equal the negative of the center's orbital angle. This is what
      // makes the two circular motions cancel in y and add in x, producing
      // the straight-line (diameter) trace that is the whole point of the
      // Tusi couple.
      const pointAngle = -theta;
      const tracePoint = polar(smallCenter.x, smallCenter.y, smallR, pointAngle);

      if(showTrace){
        ctx.beginPath();
        ctx.moveTo(CX - bigR, CY);
        ctx.lineTo(CX + bigR, CY);
        ctx.strokeStyle = "rgba(201,162,75,0.35)";
        ctx.lineWidth = 6;
        ctx.stroke();
      }

      drawDot(smallCenter.x, smallCenter.y, 3, "#9fb6cf");
      drawDot(tracePoint.x, tracePoint.y, 7, "#C9A24B", 16);
      drawLabel(tracePoint.x+10, tracePoint.y-8, "traced point", "#E0BE6C", 11);
    }

    function drawEmbedded(time){
      // Earth sits at the true center; the couple's whole apparatus rides
      // out on a deferent, oriented so its straight-line diameter always
      // points radially (toward/away from Earth). Because the trace point
      // moves back and forth along that radial line, the net effect is a
      // planet whose angle is set by the deferent alone, while its distance
      // from Earth oscillates -- exactly the kind of correction Ibn
      // al-Shatir and, later, Copernicus used a couple for, in place of an
      // equant.
      drawDot(CX, CY, 9, "#6E8FAE", 14);
      drawLabel(CX+14, CY+4, "Earth", "#9fb6cf", 12);
      drawCircle(CX, CY, deferentR, "#3A4A6B", 1);

      const deferentAngle = time*orbitSpeed;
      const dir = { x: Math.cos(deferentAngle), y: Math.sin(deferentAngle) };
      const deferentPoint = polar(CX, CY, deferentR, deferentAngle);

      const smallR = embedBigR/2;
      const theta = time*spin;

      // small couple circle's center, in the couple's own (unrotated) frame,
      // then rotated so the frame's x-axis points along `dir`
      const scLocalX = smallR*Math.cos(theta), scLocalY = smallR*Math.sin(theta);
      const smallCenter = {
        x: deferentPoint.x + scLocalX*dir.x - scLocalY*dir.y,
        y: deferentPoint.y + scLocalX*dir.y + scLocalY*dir.x
      };

      // traced point stays on the local x-axis (y_local = 0), so after
      // rotation it simply slides along the Earth-deferentPoint radial line
      const tpLocalX = embedBigR*Math.cos(theta);
      const tracePoint = {
        x: deferentPoint.x + tpLocalX*dir.x,
        y: deferentPoint.y + tpLocalX*dir.y
      };

      // the radial line the point can travel along
      ctx.beginPath();
      ctx.moveTo(deferentPoint.x - embedBigR*dir.x, deferentPoint.y - embedBigR*dir.y);
      ctx.lineTo(deferentPoint.x + embedBigR*dir.x, deferentPoint.y + embedBigR*dir.y);
      ctx.strokeStyle = "rgba(201,162,75,0.3)";
      ctx.lineWidth = 5;
      ctx.stroke();

      if(showTrajectory){
        trail.push({x:tracePoint.x, y:tracePoint.y});
        if(trail.length > MAXTRAIL) trail.shift();
        ctx.beginPath();
        for(let i=0;i<trail.length;i++){
          const p = trail[i];
          if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
        }
        ctx.strokeStyle = "rgba(166,68,31,0.65)";
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }

      drawCircle(deferentPoint.x, deferentPoint.y, embedBigR, "#54607f", 1.2);
      drawCircle(smallCenter.x, smallCenter.y, smallR, "#3A4A6B", 1);
      drawDot(deferentPoint.x, deferentPoint.y, 3, "#9fb6cf");

      drawDot(tracePoint.x, tracePoint.y, 7, "#C9A24B", 16);
      drawLabel(tracePoint.x+10, tracePoint.y-8, "planet", "#E0BE6C", 12);
    }

    // The true (exact) eccentric+equant position, same convention as the
    // Epicycles tab: deferent center C = Earth + (e,0), equant Q = Earth +
    // (2e,0), planet moves at a uniform angle psi as seen from Q. Used here
    // only as a reference curve to check the couple-based reconstruction
    // against, and to display the residual error.
    function exactEquantPoint(R, e, psi){
      const dx = Math.cos(psi), dy = Math.sin(psi);
      const qcx = -e, qcy = 0; // (C - Q)
      const dDotQc = dx*qcx + dy*qcy;
      const qcMagSq = e*e;
      const disc = Math.max(0, dDotQc*dDotQc - (qcMagSq - R*R));
      const s = dDotQc + Math.sqrt(disc);
      return { x: 2*e + dx*s, y: dy*s };
    }

    // One couple, in isolation, contributes displacement A*cos(theta) along
    // whichever fixed direction (dirX,dirY) its diameter is aligned with;
    // its own small rolling circle's center is also returned for drawing.
    function coupleGeometry(originX, originY, A, theta, dirX, dirY){
      const r = A/2;
      const scLocalX = r*Math.cos(theta), scLocalY = r*Math.sin(theta);
      const smallCenter = {
        x: originX + scLocalX*dirX - scLocalY*dirY,
        y: originY + scLocalX*dirY + scLocalY*dirX
      };
      const tpLocalX = A*Math.cos(theta);
      const tracePoint = { x: originX + tpLocalX*dirX, y: originY + tpLocalX*dirY };
      return { smallCenter, tracePoint, r };
    }

    function drawEquantReproduction(time){

      // eccentric+equant position equals a fixed point O' = Earth+(1.5e,0),
      // plus a main circle of radius R at the uniform angle psi=wt, plus a
      // small circular correction of radius e/2 at angle (2*psi + pi). That
      // small correction -- a point moving on a circle at twice the main
      // rate -- can itself be built from nothing but two Tusi couples set
      // at right angles: one couple's straight-line motion supplies the x
      // component, the other's supplies the y component, each driven at
      // twice psi with an appropriate phase.
      const psi = time*orbitSpeed;
      const e = eqEcc;
      const Ox = CX + 1.5*e, Oy = CY;

      drawCircle(Ox, Oy, eqDeferentR, "#3A4A6B", 1);

      ctx.moveTo(Ox, Oy); ctx.lineTo(epiCenter.x, epiCenter.y);
      ctx.strokeStyle = "rgba(110,143,174,0.35)";
      ctx.lineWidth = 1;
      ctx.stroke();

      const A = e/2;
      const thetaX = 2*psi + Math.PI;
      const thetaY = 2*psi + Math.PI/2;
      const cx = coupleGeometry(epiCenter.x, epiCenter.y, A, thetaX, 1, 0);
      const cy = coupleGeometry(epiCenter.x, epiCenter.y, A, thetaY, 0, 1);

      const planet = {
        x: cx.tracePoint.x,
        y: cy.tracePoint.y
      };

      // draw both couples, centered on the same point, at right angles
      if(A > 0.5){
        drawCircle(epiCenter.x, epiCenter.y, A, "rgba(84,96,127,0.6)", 1);
        drawCircle(cx.smallCenter.x, cx.smallCenter.y, cx.r, "rgba(58,74,107,0.7)", 1);
        drawCircle(cy.smallCenter.x, cy.smallCenter.y, cy.r, "rgba(58,74,107,0.7)", 1);

        ctx.moveTo(cx.tracePoint.x, cx.tracePoint.y); ctx.lineTo(planet.x, planet.y);
        ctx.moveTo(cy.tracePoint.x, cy.tracePoint.y); ctx.lineTo(planet.x, planet.y);
        ctx.strokeStyle = "rgba(201,162,75,0.35)";
        ctx.lineWidth = 1;

      drawDot(epiCenter.x, epiCenter.y, 3, "#9fb6cf");

      if(showExactOverlay){
        ctx.beginPath();
        for(let i=0;i<=200;i++){
          const p2 = exactEquantPoint(eqDeferentR, e, (i/200)*Math.PI*2);

          if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.setLineDash([4,5]);
        ctx.strokeStyle = "rgba(166,68,31,0.55)";
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.setLineDash([]);

        const exact = exactEquantPoint(eqDeferentR, e, psi);
        const exactPx = CX+exact.x, exactPy = CY+exact.y;
        drawDot(exactPx, exactPy, 4, "#A6441F", 8);
        const err = Math.hypot(exactPx-planet.x, exactPy-planet.y);
        drawLabel(exactPx+9, exactPy+14, "exact equant (err " + err.toFixed(1) + "px)", "#A6441F", 10);
      }

      drawDot(planet.x, planet.y, 7, "#C9A24B", 16);
      drawLabel(planet.x+10, planet.y-8, "planet (via couples)", "#E0BE6C", 11.5);
    }

  const Kepler = (function(){

    const PHI = (1+Math.sqrt(5))/2;

    // edges auto-detected as the shortest-distance vertex pairs -- avoids

    }
    function buildSolid(name){

        for(const s1 of [1,-1]) for(const s2 of [1,-1]){
          v.push([0, s1/PHI, s2*PHI]);
          v.push([s1/PHI, s2*PHI, 0]);
          v.push([s2*PHI, 0, s1/PHI]);
        }
      }
      v = normalizeAll(v); // circumradius = 1
      return { verts: v, edges: autoEdges(v) };
    }
    // build once; verified counts: Octahedron 6v/12e, Cube 8v/12e,
    // Tetrahedron 4v/6e, Icosahedron 12v/30e, Dodecahedron 20v/30e
    const solidGeom = {};
    solidOrder.forEach(name => { solidGeom[name] = buildSolid(name); });

    let mode = 'solids'; // 'solids' | 'ellipse'
    let projMode = '3d'; // '3d' (free-orientation wireframe) | '2d' (flat, fixed)
    let az = 0.6, el = 0.35; // radians; user-controlled via drag in 3D mode
    let zoom = 1;
    const AU_PX = 32; // base pixels per AU at zoom = 1

    const visiblePlanet = {}; planetOrder.forEach(n => visiblePlanet[n] = true);
    const visibleSolid = {}; solidOrder.forEach(n => visibleSolid[n] = true);
