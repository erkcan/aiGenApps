    // Called by the shared canvas drag handler (see module wiring below)
    // while this tab is active. No-ops in 2D mode, where the view is
    // fixed and flat by design.
    function handleDrag(dx, dy){
      if(mode!=='solids' || projMode!=='3d') return;
      az += dx*0.008;
      el += dy*0.008;
      const lim = 89*Math.PI/180;
      if(el > lim) el = lim;
      if(el < -lim) el = -lim;
    }
    function wantsDrag(){ return mode==='solids' && projMode==='3d'; }

    function rotate3D(p, a, e){
      const x1 = p[0]*Math.cos(a) - p[2]*Math.sin(a);
      const z1 = p[0]*Math.sin(a) + p[2]*Math.cos(a);
      const y1 = p[1];
      const y2 = y1*Math.cos(e) - z1*Math.sin(e);
      const z2 = y1*Math.sin(e) + z1*Math.cos(e);
      return [x1, y2, z2];
    }
    function project(p, pxPerAU){
      if(projMode==='2d'){
        return { x: CX + p[0]*pxPerAU, y: CY - p[1]*pxPerAU, depth: p[2] };
      }
      const r = rotate3D(p, az, el);
      return { x: CX + r[0]*pxPerAU, y: CY - r[1]*pxPerAU, depth: r[2] };
    }

    function drawSolids(time){
      const pxPerAU = AU_PX*zoom;

      // six real orbit spheres -- a sphere's silhouette under orthographic
      // projection is always a circle regardless of viewing angle, so the
      // outline needs no projection, only its radius. The planet itself is
      // a specific point on that sphere, so it IS projected through the
      // same pipeline as the solids below -- in 3D mode it will trace an
      // apparent ellipse inside the fixed circular outline as the view
      // rotates, same as a marked point on a spinning globe.
      planetOrder.forEach((name,i)=>{
        if(!visiblePlanet[name]) return;
        const rPx = orbitAU[name]*pxPerAU;
        drawCircle(CX, CY, rPx, "#3A4A6B", 1);
        if(rPx > 16){
          const labelAngle = -Math.PI/2 + i*0.6;
          const lx = CX + Math.cos(labelAngle)*rPx, ly = CY + Math.sin(labelAngle)*rPx;
          drawLabel(lx, ly-6, name, planetColors[name], 10.5, "center");
        }
        const angle = time*planetSpeed[name]*0.4;
        const orbitPt = project([orbitAU[name]*Math.cos(angle), orbitAU[name]*Math.sin(angle), 0], pxPerAU);
        drawDot(orbitPt.x, orbitPt.y, planetSize[name], planetColors[name], 8);
      });

      // five polyhedra, each anchored so its insphere touches the inner
      // planet's real orbit -- its circumsphere then lands close to, but
      // not exactly on, the outer planet's orbit. That gap is the ~5-18%
      // mismatch Kepler rationalized as observational error.
      for(let i=0;i<solidOrder.length;i++){
        const name = solidOrder[i];
        if(!visibleSolid[name]) continue;
        const inner = planetOrder[i], outer = planetOrder[i+1];
        const S = orbitAU[inner]*ratio[name]; // scale: unit verts -> AU space
        const geom = solidGeom[name];
        const pts = geom.verts.map(v => project([v[0]*S, v[1]*S, v[2]*S], pxPerAU));

        const maxDepth = S;
        geom.edges.forEach(([a,b])=>{
          const pa = pts[a], pb = pts[b];
          const depthAvg = (pa.depth+pb.depth)/(2*maxDepth+1e-6);
          const alpha = 0.35 + 0.45*Math.max(0, Math.min(1, (depthAvg+1)/2));
          ctx.beginPath();
          ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
          ctx.strokeStyle = `rgba(201,162,75,${alpha.toFixed(2)})`;
          ctx.lineWidth = 1.1;
          ctx.stroke();
        });

        // label + live mismatch readout, in fixed screen space
        const predictedOuterAU = S;
        const errPct = ((predictedOuterAU - orbitAU[outer])/orbitAU[outer])*100;
        const midAU = (orbitAU[inner]+predictedOuterAU)/2;
        const midPx = midAU*pxPerAU;
        const labelAngle = -Math.PI/2 + i*0.5;
        const lx = CX + Math.cos(labelAngle)*midPx, ly = CY + Math.sin(labelAngle)*midPx;
        if(midPx > 16){
          drawLabel(lx, ly, name, "#C9A24B", 10, "center");
          drawLabel(lx, ly+12, (errPct>=0?'+':'')+errPct.toFixed(1)+'% vs real orbit', "#A6441F", 9, "center");
          if(showKeplerHistorical){
            const kh = keplerHistorical[name];
            const khErrPct = ((kh.predicted-kh.actual)/kh.actual)*100;
            const note = name==='Octahedron' ? ' (midsphere)' : '';
            drawLabel(lx, ly+24, "Kepler 1596: "+(khErrPct>=0?'+':'')+khErrPct.toFixed(1)+"%"+note, "#6E8FAE", 8.5, "center");
          }
        }
      }

      drawDot(CX, CY, 9, "#E0BE6C", 18);
      drawLabel(CX+14, CY+4, "Sun", "#E0BE6C", 12);
    }

    function drawEllipse(time){
      // single planet on an ellipse with the Sun at one focus, equal-area sweep
      const a = 260, b = 165; // semi-major / semi-minor
      const c = Math.sqrt(a*a-b*b); // focal distance
      const sunX = CX - c, sunY = CY;
      drawDot(sunX, sunY, 10, "#E0BE6C", 20);
      drawLabel(sunX, sunY+26, "Sun (at focus)", "#E0BE6C", 11, "center");
      const emptyFocusX = CX + c;
      drawDot(emptyFocusX, sunY, 3, "#54607f", 4);
      drawLabel(emptyFocusX, sunY+18, "empty focus", "#54607f", 10, "center");

      ctx.beginPath();
      ctx.ellipse(CX, CY, a, b, 0, 0, Math.PI*2);
      ctx.strokeStyle = "#3A4A6B";
      ctx.lineWidth = 1.3;
      ctx.stroke();

      // approximate Kepler's second law via eccentric-anomaly-ish speed variation:
      // move faster near the Sun-side focus (perihelion), slower opposite (aphelion)
      const meanAngle = time*0.35;
      const speedVar = 1 - 0.55*Math.cos(meanAngle);
      const angle = meanAngle; // simplified visual approximation, not exact Kepler solve
      const ex = CX + a*Math.cos(angle);
      const ey = CY + b*Math.sin(angle);

      drawDot(ex, ey, 7, "#C9A24B", 16);
      drawLabel(ex+10, ey-8, "planet", "#E0BE6C", 11);

      ctx.beginPath();
      ctx.moveTo(sunX, sunY); ctx.lineTo(ex,ey);
      ctx.strokeStyle = "rgba(201,162,75,0.4)";
      ctx.lineWidth=1;
      ctx.stroke();
    }

    function draw(time){
      if(mode==='solids') drawSolids(time); else drawEllipse(time);
    }

        problem:"Kepler, hayatının geri kalanında cisimler modelini gözden geçirmeye devam etti; eliptik yörüngeleri keşfettikten onlarca yıl sonra bile genişletilmiş bir baskı yayımladı. Ondan hiçbir zaman tam olarak vazgeçmedi &mdash; modelin yanlış olmasının, onun her şeyi hakkında yanlış olmayı gerektirmediğinin yararlı bir hatırlatıcısı. Gerçek ölçekte Güneş'e yakın küçük bir yığın olan ve Satürn'e uzanan küple karşılaştırıldığında iç Merkür&ndash;sekizyüzlü&ndash;Venüs kümesini görmek için yakınlaştırma kaydırıcısını yukarı çekin &mdash; tam olarak Kepler'in kendi 1596 gravüründe görülen sıkışıklık.<br><br><span style=\"font-size:0.8em;color:#6b5a3a\">Tarihsel rakamlar (Tablo 2 ve yukarıdaki köşe/yüzey akıl yürütmesi) şu kaynaktandır: Po-Hung Liu, \u201cLogical or Epistemological? A Study on Kepler\u2019s 3M Cosmological Model,\u201d <i>Journal of Humanistic Mathematics</i>, Cilt 14 Sayı 1 (Ocak 2024), sayfa 196\u2013207. DOI: 10.5642/jhummath.GNYU9082.</span>"
    };
    return {
      id:'kepler', title:"Kepler's Solids", titleTR:"Kepler'in Cisimleri",
      label:'Mysterium Cosmographicum, 1596',
      controlsHTML, bindControls, draw, reset, handleDrag, wantsDrag,
      get caption(){
        const en = mode==='solids'
          ? 'A true 3D wireframe, to scale \u2014 drag the diagram to orbit around it, or switch to a flat 2D view. Toggle individual planets or solids off to see past the outer layers.'
          : 'Thirteen years later Kepler abandoned the solids for a better fit to Tycho\u2019s data: orbits are ellipses, and planets sweep equal areas in equal time.';
        const tr = mode==='solids'
          ? 'Gerçek ölçekli, gerçek bir 3B tel kafes \u2014 etrafında dönmek için şemayı sürükleyin veya düz bir 2B görünüme geçin. Dış katmanların ötesini görmek için tek tek gezegenleri veya cisimleri kapatın.'
          : 'On üç yıl sonra Kepler, Tycho\u2019nun verisine daha iyi uyması için cisimlerden vazgeçti: yörüngeler elipstir ve gezegenler eşit zamanlarda eşit alanlar tarar.';
        return lang==='tr' ? tr : en;
      },
      get panel(){ return lang==='tr' ? panelTR : panelEN; }
    };
  })();

  /* ==================================================================
     MODULE 5: Tycho Brahe (geo-heliocentric hybrid)
     ================================================================== */
  const Brahe = (function(){
    const planets = [
      {name:'Mercury', r:55,  speed:1.60, color:'#9fb6cf', size:3},
      {name:'Venus',   r:85,  speed:1.18, color:'#e0c98a', size:4},
      {name:'Mars',    r:150, speed:0.53, color:'#C9A24B', size:4},
      {name:'Jupiter', r:200, speed:0.24, color:'#cfa96a', size:6},
      {name:'Saturn',  r:245, speed:0.14, color:'#b8a878', size:5}
    ];
    const sunOrbitR = 135, sunSpeed = 1.0;

    // real mean orbital radii in AU, same values used in the Kepler tab,
    // for the true-to-scale toggle below
    const orbitAU = { Mercury:0.39528, Venus:0.72335, Earth:1.0, Mars:1.53031, Jupiter:5.20946, Saturn:9.55105 };
    const AU_PX = 32;
    let trueScale = false;
    let zoom = 1;

    function controlsHTML(){
      return `
        <div class="group">
          <button class="pill ${trueScale?'on':''}" id="br_scale">true-to-scale orbits</button>
        </div>
        ${trueScale ? `<div class="group">
          <label>zoom
            <input type="range" id="br_zoom" min="0.5" max="15" step="0.25" value="${zoom}">
          </label>
        </div>` : ''}
      `;
    }
    function bindControls(){
      const scaleBtn = document.getElementById('br_scale');
      scaleBtn.addEventListener('click', ()=>{ trueScale = !trueScale; refreshModuleControls(); });
      const zoomSlider = document.getElementById('br_zoom');
      if(zoomSlider) zoomSlider.addEventListener('input', e=>{ zoom = parseFloat(e.target.value); });
    }
    function reset(){}

    function draw(time){
      const pxPerAU = AU_PX*zoom;
      const sunR = trueScale ? orbitAU.Earth*pxPerAU : sunOrbitR;

      drawDot(CX, CY, 9, "#6E8FAE", 14);
      drawLabel(CX+14, CY+4, "Earth (fixed)", "#9fb6cf", 12);

      drawCircle(CX, CY, sunR, "#3A4A6B", 1.3);
      const sunAngle = time*sunSpeed*0.4;
      const sun = polar(CX, CY, sunR, sunAngle);

      planets.forEach(p=>{
        const pr = trueScale ? orbitAU[p.name]*pxPerAU : p.r;
        drawCircle(sun.x, sun.y, pr, "rgba(58,74,107,0.55)", 1);
        const angle = time*p.speed*0.4;
        const pos = polar(sun.x, sun.y, pr, angle);
        drawDot(pos.x, pos.y, p.size, p.color, 7);
        if(!trueScale || pr > 16){
          drawLabel(pos.x+7, pos.y-6, p.name, p.color, 9.5);
        }
      });

      drawDot(sun.x, sun.y, 10, "#E0BE6C", 20);
      drawLabel(sun.x+14, sun.y+4, "Sun", "#E0BE6C", 12);
    }

    const panelEN = {
        heading:'The Tychonic Compromise',
        meta:'Tycho Brahe, De Mundi Aetherei Recentioribus Phaenomenis, 1588',
        body:[
          "Tycho Brahe was the best observational astronomer of his age, and he took Copernicus seriously &mdash; but rejected heliocentrism for what were, at the time, legitimate physical reasons.",
          "If Earth truly orbited the Sun, nearby stars should show parallax &mdash; a yearly back-and-forth shift against the background sky. Tycho's instruments, the most precise pre-telescopic ones ever built, detected none. (The real explanation: stars are vastly farther away than anyone assumed, making the parallax too small to see without a telescope.)",
          "His solution kept Earth fixed and motionless, satisfying both the physics and the astronomy of his day: the Sun orbits Earth, and all the other planets orbit the Sun as it goes. Watch the diagram &mdash; every planet's position relative to Earth ends up identical to the Copernican prediction.",
          "The default view above spaces the orbits out evenly for legibility, the same simplification most textbook diagrams make. Toggle <b>true-to-scale orbits</b> to see the real relative distances instead, using the same AU figures as the Kepler tab: Mercury, Venus, Earth and Mars are crowded into a small inner cluster, while Jupiter and Saturn sit much farther out &mdash; the zoom control lets you inspect either end."
        ],
        problem:"This is the crux of the whole story: Tycho's model is geometrically equivalent to Copernicus's for predicting where planets appear in the sky. Choosing between them wasn't decided by better predictions &mdash; it took new physical evidence (stellar parallax, Newtonian mechanics, stellar aberration) arriving over the next two centuries."
    };
    const panelTR = {
        heading:'Tycho Uzlaşması',
        meta:'Tycho Brahe, De Mundi Aetherei Recentioribus Phaenomenis, 1588',
        body:[
          "Tycho Brahe, çağının en iyi gözlemci astronomuydu ve Kopernik'i ciddiye aldı &mdash; ama o dönem için meşru sayılan fiziksel nedenlerle güneş merkezliliği reddetti.",
          "Eğer Dünya gerçekten Güneş çevresinde dönüyor olsaydı, yakın yıldızlar ıraksama (paralaks) göstermeliydi &mdash; arka plandaki gökyüzüne göre yıllık ileri geri bir kayma. Tycho'nun aletleri, teleskop öncesi dönemde inşa edilmiş en hassas aletler, hiçbir ıraksama tespit etmedi. (Gerçek açıklama: yıldızlar herkesin varsaydığından çok daha uzaktaydı, bu da ıraksamayı teleskopsuz görülemeyecek kadar küçük yapıyordu.)",
          "Onun çözümü Dünya'yı sabit ve hareketsiz tutarak hem döneminin fiziğini hem de astronomisini tatmin ediyordu: Güneş, Dünya'nın çevresinde dolanır ve diğer tüm gezegenler de o ilerlerken Güneş'in çevresinde dolanır. Şemayı izleyin &mdash; her gezegenin Dünya'ya göre konumu, sonunda Kopernik'in öngörüsüyle özdeş çıkar.",
          "Yukarıdaki varsayılan görünüm, okunabilirlik için yörüngeleri eşit aralıklarla yerleştirir; bu, çoğu ders kitabı şemasının yaptığı aynı basitleştirmedir. Bunun yerine gerçek göreli uzaklıkları görmek için, Kepler sekmesiyle aynı AB rakamlarını kullanan <b>gerçek ölçekli yörüngeler</b> seçeneğini açın: Merkür, Venüs, Dünya ve Mars küçük bir iç kümede sıkışırken, Jüpiter ve Satürn çok daha uzakta bulunur &mdash; yakınlaştırma kontrolü her iki ucu da incelemenize olanak tanır."
        ],
        problem:"İşte tüm hikâyenin can alıcı noktası burada: Tycho'nun modeli, gezegenlerin gökyüzünde nerede görüneceğini öngörmek açısından Kopernik'inkiyle geometrik olarak eşdeğerdir. Aralarında seçim yapmak daha iyi öngörülerle belirlenmedi &mdash; sonraki iki yüzyıl içinde ortaya çıkacak yeni fiziksel kanıtlar (yıldız ıraksaması, Newton mekaniği, yıldız sapması) gerekti."
    };
    return {
      id:'brahe', title:'Brahe', titleTR:'Brahe', label:'De Mundi Aetherei, 1588',
      controlsHTML, bindControls, draw, reset,
      get caption(){
        const en = trueScale
          ? 'True orbital ratios: notice how tightly Mercury\u2013Venus\u2013Earth\u2013Mars crowd near the Sun compared to Jupiter and Saturn. Zoom in to see the inner planets clearly.'
          : 'Earth stays fixed at the center; the Sun orbits Earth; every other planet orbits the moving Sun. Geometrically, this predicts the same planetary positions as Copernicus.';
        const tr = trueScale
          ? 'Gerçek yörünge oranları: Merkür\u2013Venüs\u2013Dünya\u2013Mars\u2019ın, Jüpiter ve Satürn\u2019e kıyasla Güneş\u2019e ne kadar sıkı sıkıya kümelendiğine dikkat edin. İç gezegenleri net görmek için yakınlaştırın.'
          : 'Dünya merkezde sabit kalır; Güneş, Dünya\u2019nın çevresinde dolanır; diğer tüm gezegenler ise hareket eden Güneş\u2019in çevresinde dolanır. Geometrik olarak bu, Kopernik ile aynı gezegen konumlarını öngörür.';
        return lang==='tr' ? tr : en;
      },
      get panel(){ return lang==='tr' ? panelTR : panelEN; }
    };
  })();

  /* ==================================================================
     MODULE 6: Heliocentric (modern, with retrograde comparison)
     ================================================================== */
  const Helio = (function(){
    // Stylized default layout (not to scale -- see the true-to-scale
    // toggle below). 'key' matches ORBIT_ELEMENTS, the same verified
    // real orbital data already used for the Tycho declination chart.
    const bodies = [
      {key:'mercury', name:'Mercury', r:55,  speed:1.60, color:'#9fb6cf', size:3, core:false},
      {key:'venus',   name:'Venus',   r:90,  speed:1.18, color:'#e0c98a', size:4, core:false},
      {key:'earth',   name:'Earth',   r:135, speed:1.00, color:'#6E8FAE', size:5, core:true},
      {key:'mars',    name:'Mars',    r:205, speed:0.53, color:'#C9A24B', size:4, core:true},
      {key:'jupiter', name:'Jupiter', r:245, speed:0.24, color:'#cfa96a', size:6, core:false},
      {key:'saturn',  name:'Saturn',  r:295, speed:0.14, color:'#b8a878', size:5, core:false}
    ];
    const earthBody = bodies.find(b=>b.key==='earth'), marsBody = bodies.find(b=>b.key==='mars');
    let trueScale = false, zoom = 1;
    const AU_PX = 32;
    // Maps animation time to a day-offset for orbitHeliocentric, chosen so
    // Earth still completes one revolution over the same span of "time"
    // as the stylized mode's speed=1.00 (2*PI/0.4 time-units) -- keeps the
    // overall pace familiar even though true-scale mode now drives every
    // body from its real orbital elements instead of a fixed multiplier.
    const DAYS_PER_TIME_UNIT = 23.253;
    function bodyGeometry(b, pxPerAU, time){
      if(!trueScale) return { r: b.r, speed: b.speed };
      const el = ORBIT_ELEMENTS[b.key];
      const td = time*DAYS_PER_TIME_UNIT;
      const pos = orbitHeliocentric(td, el.a, el.M0, el.e, el.O, el.w, el.i);
      return { pos: { x: CX + pos.xP*pxPerAU, y: CY - pos.yP*pxPerAU } };
    }
    // The orbit's real elliptical shape doesn't depend on time (only its
    // position along that shape does), so this is resampled fresh each
    // frame from orbitXYFromM -- cheap (72 Kepler-solves per visible
    // body) and avoids any stale-shape bugs from caching against zoom.
    function drawTrueOrbit(key, pxPerAU, color){
      const el = ORBIT_ELEMENTS[key];
      ctx.beginPath();
      for(let M=0; M<=360; M+=5){
        const p = orbitXYFromM(M, el.a, el.e, el.O, el.w, el.i);
        const x = CX+p.xP*pxPerAU, y = CY-p.yP*pxPerAU;
        if(M===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = color; ctx.lineWidth = 1;
      ctx.stroke();
    }
    // In true-scale mode, a single fixed AU_PX would leave Earth/Mars as a
    // barely-visible dot near the Sun whenever the outer planets aren't
    // shown (Saturn's real distance sets the scale otherwise) -- motion
    // that's real but easy to mistake for the animation having stalled or
    // desynced. Auto-fit the baseline to whichever body is currently
    // farthest out, so the visible orbits always fill a similar fraction
    // of the canvas; this only changes the shared scale factor, so every
    // body's radius stays in exactly the same true proportion to every
    // other. The zoom slider still multiplies on top of this baseline.
    function autoPxPerAU(){
      const visibleKeys = showOtherPlanets
        ? ['mercury','venus','earth','mars','jupiter','saturn']
        : ['earth','mars'];
      const maxA = Math.max(...visibleKeys.map(k=>ORBIT_ELEMENTS[k].a));
      return 320/maxA;
    }

    let showOtherPlanets = false;
    let showGeoProjection = false;
    let projTrail = [];
    const MAXTRAIL = 700;
    let showDeclChart = false;

    // both insets are click-and-drag repositionable; these track their
    // current top-left / center, defaulting to where they first appeared
    const GEO_R = 109, DECL_W = 430, DECL_H = 150;
    let geoInsetPos = { x: 560, y: 560 };   // center
    let declInsetPos = { x: 16, y: 14 };    // top-left
    let dragTarget = null; // 'geo' | 'decl' | null, set by dragHitTest

    function clampGeoInset(){
      geoInsetPos.x = Math.max(GEO_R, Math.min(700-GEO_R, geoInsetPos.x));
      geoInsetPos.y = Math.max(GEO_R, Math.min(700-GEO_R, geoInsetPos.y));
    }
    function clampDeclInset(){
      declInsetPos.x = Math.max(0, Math.min(700-DECL_W, declInsetPos.x));
      declInsetPos.y = Math.max(0, Math.min(700-DECL_H, declInsetPos.y));
    }

    function wantsDrag(){ return showGeoProjection || showDeclChart; }
    function dragHitTest(x, y){
      dragTarget = null;
      if(showGeoProjection){
        const dx = x-geoInsetPos.x, dy = y-geoInsetPos.y;
        if(Math.sqrt(dx*dx+dy*dy) <= GEO_R){ dragTarget = 'geo'; return true; }
      }
      if(showDeclChart){
        if(x>=declInsetPos.x && x<=declInsetPos.x+DECL_W && y>=declInsetPos.y && y<=declInsetPos.y+DECL_H){
          dragTarget = 'decl'; return true;
        }
      }
      return false;
    }
    function handleDrag(dx, dy){
      if(dragTarget==='geo'){ geoInsetPos.x += dx; geoInsetPos.y += dy; clampGeoInset(); projTrail = []; }
      else if(dragTarget==='decl'){ declInsetPos.x += dx; declInsetPos.y += dy; clampDeclInset(); }
    }

    // computed once and cached: the model's predicted Mars declination
    // curve across the same span as Tycho's observations, plus the
    // resulting error statistics against his real data
    let declCurve = null, declStats = null;
    function buildDeclChart(){
      if(declCurve) return;
      declCurve = [];
      for(let y=1582; y<=1594; y++){
        for(let doy=0; doy<360; doy+=3){
          const m = Math.floor(doy/30)+1, d = (doy%30)+1;
          declCurve.push({ t: decYear(y,m,d), dec: orbitPlanetDec('mars', y, m, d) });
        }
      }
      let sumSq = 0, maxErr = 0;
      TYCHO_MARS_DEC.forEach(([y,m,d,dec])=>{
        const pred = orbitPlanetDec('mars', y, m, d);
        const err = pred - dec;
        sumSq += err*err;
        if(Math.abs(err) > Math.abs(maxErr)) maxErr = err;
      });
      declStats = { rms: Math.sqrt(sumSq/TYCHO_MARS_DEC.length), maxErr, n: TYCHO_MARS_DEC.length };
    }

    function controlsHTML(){
      return `
        <div class="group">
          <button class="pill ${trueScale?'on':''}" id="he_scale">true-to-scale orbits &amp; speeds</button>
          ${trueScale ? `<label>zoom
            <input type="range" id="he_zoom" min="0.5" max="15" step="0.25" value="${zoom}">
          </label>` : ''}
        </div>
        <div class="group">
          <button class="pill ${showOtherPlanets?'on':''}" id="he_other">show other planets</button>
        </div>
        <div class="group">
          <button class="pill ${showGeoProjection?'on':''}" id="he_proj">show Mars as seen from Earth</button>
        </div>
        <div class="group">
          <button class="pill ${showDeclChart?'on':''}" id="he_decl">declination vs. Tycho's data</button>
        </div>
      `;
    }
    function bindControls(){
      const bScale = document.getElementById('he_scale');
      bScale.addEventListener('click', ()=>{ trueScale = !trueScale; refreshModuleControls(); });
      const zoomSlider = document.getElementById('he_zoom');
      if(zoomSlider) zoomSlider.addEventListener('input', e=>{ zoom = parseFloat(e.target.value); });
      const b0 = document.getElementById('he_other');
      b0.addEventListener('click', ()=>{
        showOtherPlanets = !showOtherPlanets;
        b0.classList.toggle('on', showOtherPlanets);
      });
      const b = document.getElementById('he_proj');
      b.addEventListener('click', ()=>{
        showGeoProjection = !showGeoProjection;
        b.classList.toggle('on', showGeoProjection);
        projTrail = [];
      });
      const b2 = document.getElementById('he_decl');
      b2.addEventListener('click', ()=>{
        showDeclChart = !showDeclChart;
        b2.classList.toggle('on', showDeclChart);
        if(showDeclChart) buildDeclChart();
      });
    }
    function reset(){ projTrail = []; }

    function drawDeclinationInset(time){
      buildDeclChart();
      // compact inset, top-left, clear of the main orbit diagram and the
      // "as seen from Earth" inset (bottom-right)
      const boxX=declInsetPos.x, boxY=declInsetPos.y, boxW=DECL_W, boxH=DECL_H;
      const left=boxX+38, right=boxX+boxW-14, top=boxY+22, bottom=boxY+boxH-20;
      const yMin=-30, yMax=30, tMin=1582, tMax=1595;
      const px = t => left + (t-tMin)/(tMax-tMin)*(right-left);
      const py = dec => bottom - (dec-yMin)/(yMax-yMin)*(bottom-top);

      ctx.save();
      ctx.beginPath();
      ctx.rect(boxX, boxY, boxW, boxH);
      ctx.fillStyle = "rgba(11,18,32,0.88)";
      ctx.fill();
      ctx.strokeStyle = "#3A4A6B";
      ctx.lineWidth = 1;
      ctx.stroke();

      drawLabel(boxX+10, boxY+13, "Mars declination: model vs. Tycho", "#E0BE6C", 9.5);

      ctx.strokeStyle = "rgba(58,74,107,0.5)"; ctx.lineWidth = 0.7;
      [-20,0,20].forEach(dec=>{
        ctx.beginPath(); ctx.moveTo(left, py(dec)); ctx.lineTo(right, py(dec)); ctx.stroke();
        drawLabel(left-6, py(dec)+3, dec+"\u00b0", "#9fb6cf", 7.5, "right");
      });
      [1584,1588,1592].forEach(y=>{
        drawLabel(px(y), bottom+11, String(y), "#9fb6cf", 7.5, "center");
      });
      ctx.strokeStyle = "#54607f"; ctx.lineWidth = 1;
      ctx.strokeRect(left, top, right-left, bottom-top);

      ctx.beginPath();
      declCurve.forEach((p,i)=>{
        const x = px(p.t), y = py(p.dec);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.strokeStyle = "#6E8FAE"; ctx.lineWidth = 1.1;
      ctx.stroke();

      TYCHO_MARS_DEC.forEach(([y,m,d,dec])=>{
        const x = px(decYear(y,m,d)), yy = py(dec);
        drawDot(x, yy, 1.6, "#C9A24B", 2);
      });

      // moving cursor, synced to the same shared clock driving the orbit
      // animation -- sweeps across the full 1582-1594 span repeatedly
      const span = tMax-tMin;
      const curT = tMin + ((time*0.15) % span + span) % span;
      let nearest = declCurve[0], bestD = Infinity;
      for(let i=0;i<declCurve.length;i++){
        const dd = Math.abs(declCurve[i].t - curT);
        if(dd < bestD){ bestD = dd; nearest = declCurve[i]; }
      }
      const cx = px(curT);
      ctx.beginPath();
      ctx.moveTo(cx, top); ctx.lineTo(cx, bottom);
      ctx.strokeStyle = "rgba(201,162,75,0.6)";
      ctx.lineWidth = 1;
      ctx.stroke();
      drawDot(cx, py(nearest.dec), 3.2, "#C9A24B", 9);

      const curYear = Math.floor(curT);
      const curMonth = Math.max(1, Math.min(12, Math.floor((curT-curYear)*12)+1));
      drawLabel(right, boxY+13, curYear+"\u2013"+curMonth+"  \u00b7  RMS "+declStats.rms.toFixed(1)+"\u00b0", "#A6441F", 8.5, "right");
      ctx.restore();
    }

    function draw(time){
      const pxPerAU = (trueScale ? autoPxPerAU() : AU_PX) * zoom;
      drawDot(CX, CY, 11, "#E0BE6C", 22);
      drawLabel(CX+16, CY+5, "Sun", "#E0BE6C", 12);

      if(showOtherPlanets){
        bodies.filter(b=>!b.core).forEach(b=>{
          let pos;
          if(trueScale){
            drawTrueOrbit(b.key, pxPerAU, "#3A4A6B");
            pos = bodyGeometry(b, pxPerAU, time).pos;
          } else {
            const g = bodyGeometry(b, pxPerAU, time);
            drawCircle(CX, CY, g.r, "#3A4A6B", 1);
            pos = polar(CX, CY, g.r, time*g.speed*0.4);
          }
          drawDot(pos.x, pos.y, b.size, b.color, 7);
          const dist = Math.hypot(pos.x-CX, pos.y-CY);
          if(!trueScale || dist > 16) drawLabel(pos.x+7, pos.y-6, b.name, b.color, 10);
        });
      }

      let ePos, mPos;
      if(trueScale){
        drawTrueOrbit('earth', pxPerAU, "#3A4A6B");
        drawTrueOrbit('mars', pxPerAU, "#3A4A6B");
        ePos = bodyGeometry(earthBody, pxPerAU, time).pos;
        mPos = bodyGeometry(marsBody, pxPerAU, time).pos;
      } else {
        const eGeom = bodyGeometry(earthBody, pxPerAU, time);
        const mGeom = bodyGeometry(marsBody, pxPerAU, time);
        drawCircle(CX, CY, eGeom.r, "#3A4A6B", 1);
        drawCircle(CX, CY, mGeom.r, "#3A4A6B", 1);
        ePos = polar(CX, CY, eGeom.r, time*eGeom.speed*0.4);
        mPos = polar(CX, CY, mGeom.r, time*mGeom.speed*0.4);
      }

      if(showGeoProjection){
        // project Mars's position as seen from Earth onto a small inset compass at bottom-right,
        // i.e. reconstruct the apparent geocentric path
        ctx.beginPath();
        ctx.moveTo(ePos.x, ePos.y); ctx.lineTo(mPos.x, mPos.y);
        ctx.strokeStyle = "rgba(166,68,31,0.55)";
        ctx.lineWidth = 1;
        ctx.stroke();

        const dx = mPos.x-ePos.x, dy = mPos.y-ePos.y;
        const ang = Math.atan2(dy,dx);
        const insetCX = geoInsetPos.x, insetCY = geoInsetPos.y, insetR = 95;
        const px = insetCX + insetR*0.7*Math.cos(ang);
        const py = insetCY + insetR*0.7*Math.sin(ang);
        projTrail.push({x:px,y:py});
        if(projTrail.length>MAXTRAIL) projTrail.shift();

        ctx.save();
        ctx.beginPath();
        ctx.arc(insetCX, insetCY, insetR+14, 0, Math.PI*2);
        ctx.fillStyle = "rgba(11,18,32,0.88)";
        ctx.fill();
        ctx.strokeStyle = "#3A4A6B";
        ctx.stroke();
        drawDot(insetCX, insetCY, 5, "#6E8FAE", 10);
        drawLabel(insetCX, insetCY-insetR-18, "as seen from Earth", "#9fb6cf", 10.5, "center");

        ctx.beginPath();
        for(let i=0;i<projTrail.length;i++){
          const p = projTrail[i];
          if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
        }
        ctx.strokeStyle = "rgba(166,68,31,0.8)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        drawDot(px, py, 4, "#A6441F", 10);
        ctx.restore();
      }

      drawDot(ePos.x, ePos.y, 5, "#6E8FAE", 10);
      drawLabel(ePos.x+8, ePos.y-6, "Earth", "#9fb6cf", 11);
      drawDot(mPos.x, mPos.y, 4.5, "#C9A24B", 10);
      drawLabel(mPos.x+8, mPos.y-6, "Mars", "#E0BE6C", 11);

      if(showDeclChart) drawDeclinationInset(time);
    }

    const panelEN = {
        heading:'Why This One Stuck',
        meta:'Established via Kepler, Galileo, Newton, 17th century',
        body:[
          "By itself, heliocentrism didn't beat geocentrism on predictive accuracy &mdash; for decades, Ptolemaic tables were still competitive. What eventually decided it was accumulating physical evidence no geocentric model could accommodate.",
          "Galileo's telescope found moons orbiting Jupiter (proof that not everything circles Earth) and phases of Venus (only explicable if Venus orbits the Sun, not Earth). Kepler's elliptical orbits, fit to Tycho's own data, finally out-predicted every circle-based system, Tychonic included.",
          "Newton then supplied the missing physics: one law of gravitation that explained <i>why</i> planets move in ellipses around the Sun at all &mdash; something no geocentric or Tychonic model had ever attempted to explain, only to describe.",
          "By default this diagram, like most textbook orreries, is not to scale: Mercury through Mars happen to be close to their true relative sizes here, but Jupiter and Saturn are drawn far closer in than reality, every orbit is a perfect circle, and every orbital speed except Mars's is noticeably off &mdash; Mercury should visibly lap the others roughly four times for every one Earth orbit, not the gentler pace shown by default. Toggle <b>true-to-scale orbits &amp; speeds</b> to switch every body to its real elliptical orbit, computed from the same verified orbital elements and Kepler-equation solver used for the Tycho declination chart, complete with the resulting non-uniform speed (faster at perihelion, slower at aphelion) rather than a uniform circular approximation. The view automatically rescales to whichever body is currently farthest out &mdash; Mars alone, or Saturn once the other planets toggle is on &mdash; so Earth and Mars stay clearly visible either way; the zoom control adjusts further from that baseline.",
          "Eccentricity turns out to run the opposite direction from what you might expect: Mercury (0.206) is by far the most eccentric planet, with Mars a distant second (0.093), while Jupiter (0.048) and Saturn (0.056) are both closer to circular than Mars is. Watch Mercury alone in true-scale mode and the Sun sits visibly off-center in the ellipse; watch Jupiter or Saturn and the orbit looks almost indistinguishable from a circle, even though it technically isn't one.",
          "Toggle <b>declination vs. Tycho's data</b> for a small inset, top-left, that checks a simple heliocentric model directly against real 16th-century measurements rather than just asserting it works. The gold dots are Tycho's own observations of Mars's declination &mdash; over 160 dated readings from 1582&ndash;1594, drawn from his original notebooks. The blue curve is this model's prediction, computed from fixed, unperturbed elliptical orbits (no fitting to Tycho's data at all), with a moving cursor sweeping across that twelve-year span on the same clock driving the orbits above it. Typical agreement is under a degree, with a long tail out to a few degrees on some dates &mdash; residual error from extrapolating simple two-body ellipses four centuries into the past without the slow, real perturbations that Newtonian mechanics predicts and that this simplified model leaves out, on top of the inherent precision limits of quadrant-and-sextant observation. The fit is nowhere near perfect, but it is far closer than any Ptolemaic table ever managed, and it took no adjustable parameters to get there."
        ],
        problem:"Toggle the inset here and compare it to the very first tab. The looping path is the same one Ptolemy captured with an epicycle, Brahe captured by orbiting the Sun around Earth, and Copernicus captured almost by accident. Geometry alone couldn't settle which model was <i>true</i> &mdash; only which model finally explained why."
    };
    const panelTR = {
        heading:'Bu Model Neden Kalıcı Oldu',
        meta:'Kepler, Galileo ve Newton aracılığıyla kuruldu, 17. yüzyıl',
        body:[
          "Güneş merkezlilik, tek başına öngörü doğruluğunda yer merkezliliği yenmedi &mdash; onlarca yıl boyunca Batlamyus çizelgeleri hâlâ rekabetçiydi. Sonunda meseleyi çözen şey, hiçbir yer merkezli modelin barındıramayacağı, giderek biriken fiziksel kanıtlar oldu.",
          "Galileo'nun teleskobu, Jüpiter'in çevresinde dolanan aylar (her şeyin Dünya çevresinde dönmediğinin kanıtı) ve Venüs'ün evrelerini (yalnızca Venüs'ün Dünya değil Güneş çevresinde dolanmasıyla açıklanabilir) buldu. Tycho'nun kendi verisine uydurulan Kepler'in eliptik yörüngeleri, sonunda Tycho'nunki de dahil olmak üzere çembere dayalı her sistemden daha iyi öngörüde bulundu.",
          "Newton daha sonra eksik fiziği sağladı: gezegenlerin Güneş çevresinde neden elips çizerek hareket ettiğini <i>açıklayan</i> tek bir kütleçekim yasası &mdash; hiçbir yer merkezli veya Tycho modelinin açıklamaya çalışmadığı, yalnızca betimlediği bir şey.",
          "Bu şema, çoğu ders kitabı orrery'si gibi, varsayılan olarak ölçekli değildir: Merkür'den Mars'a kadar olanlar burada gerçek göreli boyutlarına yakınsa da, Jüpiter ve Satürn gerçekte olduğundan çok daha yakına çizilmiştir, her yörünge kusursuz bir çemberdir ve Mars dışındaki her yörünge hızı gözle görülür şekilde yanlıştır &mdash; Merkür, her bir Dünya turunda diğerlerini yaklaşık dört kez geride bırakmalıydı, varsayılan olarak gösterilen daha yumuşak tempoda değil. Her cismi, Tycho deklinasyon grafiği için kullanılan aynı doğrulanmış yörünge elemanlarından ve Kepler denklemi çözücüsünden hesaplanan gerçek eliptik yörüngesine geçirmek için <b>gerçek ölçekli yörüngeler ve hızlar</b> seçeneğini açın; bu, tekdüze dairesel bir yaklaşım yerine, ortaya çıkan tekdüze olmayan hızla (günberide daha hızlı, günötede daha yavaş) birlikte gelir. Görünüm, o an en dışta olan cisme göre otomatik olarak yeniden ölçeklenir &mdash; yalnız başına Mars, ya da diğer gezegenler seçeneği açıldığında Satürn &mdash; böylece Dünya ve Mars her iki durumda da net görünür kalır; yakınlaştırma kontrolü bu taban çizgisinden daha fazla ayarlama yapar.",
          "Dışmerkezliğin, beklediğinizin tam tersi yönde işlediği ortaya çıkıyor: Merkür (0,206) açık ara en dışmerkezli gezegendir, Mars uzak bir ikincidir (0,093); Jüpiter (0,048) ve Satürn (0,056) ise ikisi de Mars'tan daha dairesele yakındır. Gerçek ölçekli modda yalnızca Merkür'ü izleyin &mdash; Güneş elipste gözle görülür şekilde merkezden kaymış durur; Jüpiter veya Satürn'ü izleyin &mdash; yörünge, teknik olarak öyle olmasa da neredeyse bir çemberden ayırt edilemez görünür.",
          "Basit bir güneş merkezli modeli, yalnızca işe yaradığını iddia etmek yerine doğrudan gerçek 16. yüzyıl ölçümlerine karşı kontrol eden, sol üstteki küçük bir panel için <b>deklinasyon vs. Tycho'nun verisi</b> seçeneğini açın. Altın rengi noktalar, Tycho'nun kendi orijinal not defterlerinden alınan, Mars'ın deklinasyonuna dair 1582&ndash;1594 arasından 160'tan fazla tarihli okumadan oluşan kendi gözlemleridir. Mavi eğri ise bu modelin öngörüsüdür; sabit, pertürbasyonsuz eliptik yörüngelerden hesaplanmıştır (Tycho'nun verisine hiçbir uydurma yapılmadan), ve yukarıdaki yörüngeleri süren aynı saatle bu on iki yıllık aralığı tarayan hareketli bir imleçle gösterilir. Tipik uyum bir derecenin altındadır; bazı tarihlerde birkaç dereceye uzanan uzun bir kuyruk vardır &mdash; bu, basit iki cisimli elipsleri, Newton mekaniğinin öngördüğü ve bu basitleştirilmiş modelin dışarıda bıraktığı yavaş, gerçek pertürbasyonlar olmadan dört yüzyıl geriye götürmenin kalıntı hatasıdır; buna kadran ve sekstant gözleminin doğal hassasiyet sınırları da eklenir. Uyum hiçbir şekilde kusursuz değildir, ama herhangi bir Batlamyus çizelgesinin başardığından çok daha yakındır ve buraya ulaşmak için hiçbir ayarlanabilir parametre gerekmemiştir."
        ],
        problem:"Buradaki küçük paneli açın ve onu en ilk sekmeyle karşılaştırın. İlmekli yol, Batlamyus'un bir episiklle, Brahe'nin Güneş'i Dünya çevresinde döndürerek ve Kopernik'in neredeyse kazara yakaladığı aynı yoldur. Geometrinin tek başına hangi modelin <i>doğru</i> olduğunu belirlemesi mümkün değildi &mdash; yalnızca hangi modelin sonunda nedenini açıkladığını belirleyebildi."
    };
    return {
      id:'helio', title:'Heliocentric', titleTR:'Güneş Merkezli', label:'The model that endured',
      controlsHTML, bindControls, draw, reset, wantsDrag, dragHitTest, handleDrag,
      get caption(){
        const en = 'Earth and Mars orbit the Sun \u2014 toggle the rest of the naked-eye planets into view, or switch to true-to-scale orbits and speeds, now with real eccentricity: Mercury\u2019s orbit is visibly off-center, Jupiter and Saturn\u2019s are nearly circular. The insets reconstruct Mars\u2019s apparent path as seen from Earth and check the model against Tycho\u2019s own measurements.';
        const tr = 'Dünya ve Mars, Güneş çevresinde dolanır \u2014 çıplak gözle görülen diğer gezegenleri de görünüme almak için açın veya artık gerçek dışmerkezlikle birlikte gerçek ölçekli yörüngeler ve hızlara geçin: Merkür\u2019ün yörüngesi gözle görülür şekilde merkezden kaymıştır, Jüpiter ve Satürn\u2019ünki ise neredeyse dairesel. Küçük paneller, Mars\u2019ın Dünya\u2019dan görülen görünen yolunu yeniden kurar ve modeli Tycho\u2019nun kendi ölçümleriyle karşılaştırır.';
        return lang==='tr' ? tr : en;
      },
      get panel(){ return lang==='tr' ? panelTR : panelEN; }
    };
  })();

  /* ---------- module registry & tab wiring ---------- */
  const MODULES = [NightSky, Epicycles, Tusi, Copernicus, Kepler, Brahe, Helio];
  let current = MODULES[0];

  const tabsEl = document.getElementById('tabs');
  MODULES.forEach((m) => {
    const btn = document.createElement('button');
    btn.dataset.id = m.id;
    btn.addEventListener('click', () => switchTo(m));
    tabsEl.appendChild(btn);
  });
  function renderTabLabels(){
    let stepCounter = 0;
    MODULES.forEach((m, i) => {
      const btn = tabsEl.children[i];
      const label = (lang==='tr' && m.titleTR) ? m.titleTR : m.title;
      if(m.noStep){
        btn.innerHTML = label;
      } else {
        stepCounter++;
        btn.innerHTML = `<span class="step">${stepCounter}</span>${label}`;
      }
    });
  }
  renderTabLabels();

  function refreshModuleControls(){
    const mc = document.getElementById('moduleControls');
    mc.innerHTML = current.controlsHTML();
    current.bindControls();
    document.getElementById('caption').textContent = current.caption;
  }

  function renderPanel(){
    const p = current.panel;
    const el = document.getElementById('panel');
    el.innerHTML = `
      <h2>${p.heading}</h2>
      <p class="meta">${p.meta}</p>
      ${p.body.map(par => `<p>${par}</p>`).join('')}
      <div class="problem">${p.problem}</div>
    `;
  }

  function switchTo(m){
    current = m;
    Array.from(tabsEl.children).forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.id === m.id);
    });
    t = 0;
    if(current.reset) current.reset();
    refreshModuleControls();
    renderPanel();
    syncPanelHeight();
  }

  /* ---------- keep the explanation panel the same height as the stage,
     with its own scrollbar, on any screen size where they sit side by side
     (matches the 900px breakpoint where the layout stacks instead) ---------- */
  const stageWrapEl = document.querySelector('.stage-wrap');
  const asideEl = document.getElementById('panel');
  function syncPanelHeight(){
    if(window.innerWidth <= 900){
      asideEl.style.maxHeight = '';
      return;
    }
    asideEl.style.maxHeight = stageWrapEl.offsetHeight + 'px';
  }
  window.addEventListener('resize', syncPanelHeight);
  if('ResizeObserver' in window){
    new ResizeObserver(syncPanelHeight).observe(stageWrapEl);
  }

  /* ---------- drag-to-orbit / drag-to-reposition: any module can opt in.
     wantsDrag() (no args): cheap per-frame check -- "is anything on this
     tab draggable right now" -- used for idle cursor styling.
     dragHitTest(x,y) (optional, canvas-internal coordinates): precise
     hit-test for a specific point, used to decide whether a mousedown
     actually lands on a draggable target and, if the module tracks
     several (e.g. two independent insets), which one. Modules without
     dragHitTest are treated as draggable anywhere on the canvas
     (Kepler's free-orbit view).
     handleDrag(dx,dy): receives deltas already converted to
     canvas-internal pixels, so dragging tracks the cursor accurately
     even when the canvas is displayed at a different size than its
     700x700 internal resolution. ---------- */
  let dragging = false, lastPX = 0, lastPY = 0, lastMouseX = 0, lastMouseY = 0;
  function toCanvasCoords(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX-rect.left) * (canvas.width/rect.width),
      y: (clientY-rect.top) * (canvas.height/rect.height)
    };
  }
  function dragActive(){ return !!(current.wantsDrag && current.wantsDrag()); }
  function dragStart(x, y){
    if(!dragActive()) return;
    if(current.dragHitTest){
      const p = toCanvasCoords(x, y);
      if(!current.dragHitTest(p.x, p.y)) return;
    }
    dragging = true; lastPX = x; lastPY = y;
    canvas.style.cursor = 'grabbing';
  }
  function dragMove(x, y){
    lastMouseX = x; lastMouseY = y;
    if(!dragging) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    const dx = (x-lastPX)*scaleX, dy = (y-lastPY)*scaleY;
    lastPX = x; lastPY = y;
    if(current.handleDrag) current.handleDrag(dx, dy);
  }
  function dragEnd(){
    dragging = false;
  }
  canvas.addEventListener('mousedown', e => dragStart(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => dragMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', dragEnd);
  canvas.addEventListener('touchstart', e => {
    if(!dragActive()) return;
    const t2 = e.touches[0];
    if(current.dragHitTest){
      const p = toCanvasCoords(t2.clientX, t2.clientY);
      if(!current.dragHitTest(p.x, p.y)) return;
    }
    e.preventDefault();
    dragStart(t2.clientX, t2.clientY);
  }, { passive:false });
  canvas.addEventListener('touchmove', e => {
    if(!dragging) return;
    e.preventDefault();
    const t2 = e.touches[0]; dragMove(t2.clientX, t2.clientY);
  }, { passive:false });
  window.addEventListener('touchend', dragEnd);

  /* ---------- render loop ---------- */
  function frame(ts){
    if(lastFrame===null) lastFrame = ts;
    const dt = (ts-lastFrame)/1000;
    lastFrame = ts;
    if(playing) t += dt*speed;

    clear();
    current.draw(t);
    // refresh caption text in case a module's caption is dynamic (e.g. Kepler)
    document.getElementById('caption').textContent = current.caption;

    if(!dragging){
      if(!dragActive()){
        canvas.style.cursor = 'default';
      } else if(current.dragHitTest){
        const p = toCanvasCoords(lastMouseX, lastMouseY);
        canvas.style.cursor = current.dragHitTest(p.x, p.y) ? 'grab' : 'default';
      } else {
        canvas.style.cursor = 'grab';
      }
    }

    requestAnimationFrame(frame);
  }

  switchTo(MODULES[0]);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
